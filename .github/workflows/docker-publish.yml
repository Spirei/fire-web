name: Publish approved binding image without rebuilding
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable candidate and retain baseline before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,json,base64,hashlib,urllib.request,urllib.error
          registry='https://ghcr.io'
          repository='spirei/fire-web'
          expected='5fb81c5e320f39228ca6a3a2416cc60c7bfc43d2'
          baseline='88c226a57fa2fe944427e0a8d29f27641753afe4'
          credential=base64.b64encode(('Spirei:'+os.environ['GH_TOKEN']).encode()).decode()
          request=urllib.request.Request(registry+'/token?service=ghcr.io&scope=repository:'+repository+':pull,push',headers={'Authorization':'Basic '+credential})
          with urllib.request.urlopen(request,timeout=30) as response:token=json.load(response)['token']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'}
          def read(ref):
            with urllib.request.urlopen(urllib.request.Request(registry+'/v2/'+repository+'/manifests/'+ref,headers=headers),timeout=30) as response:
              raw=response.read();digest='sha256:'+hashlib.sha256(raw).hexdigest()
              assert response.headers['Docker-Content-Digest']==digest,'Registry digest mismatch'
              return raw,response.headers['Content-Type'],digest
          def revision(raw):
            manifest=json.loads(raw)
            if 'manifests' in manifest:
              images=[m for m in manifest['manifests'] if m.get('platform',{}).get('os')=='linux' and m.get('platform',{}).get('architecture')=='amd64']
              assert len(images)==1,'Expected exactly one linux/amd64 image'
              manifest=json.loads(read(images[0]['digest'])[0])
            with urllib.request.urlopen(urllib.request.Request(registry+'/v2/'+repository+'/blobs/'+manifest['config']['digest'],headers=headers),timeout=30) as response:config=json.load(response)
            return config.get('config',{}).get('Labels',{}).get('org.opencontainers.image.revision')
          def put(tag,raw,content_type):
            request=urllib.request.Request(registry+'/v2/'+repository+'/manifests/'+tag,data=raw,headers={**headers,'Content-Type':content_type},method='PUT')
            with urllib.request.urlopen(request,timeout=30) as response:assert response.status==201
          candidate,ctype,digest=read('sha-5fb81c5')
          assert revision(candidate)==expected,'Candidate revision mismatch'
          previous,oldtype,olddigest=read('latest')
          oldrevision=revision(previous)
          assert oldrevision in [baseline,expected],'Unexpected latest: refuse to overwrite another release'
          oldsha,_,oldshadigest=read('sha-88c226a')
          assert revision(oldsha)==baseline,'Baseline revision mismatch'
          if oldrevision==baseline:assert olddigest==oldshadigest,'Baseline digest mismatch'
          rollback='rollback-88c226a-20261018'
          try:assert read(rollback)[2]==oldshadigest,'Existing rollback tag differs'
          except urllib.error.HTTPError as error:
            if error.code!=404:raise
            put(rollback,oldsha,oldtype)
          assert read(rollback)[2]==oldshadigest
          print('Approved candidate revision: '+expected)
          print('Approved candidate digest: '+digest)
          print('Retained baseline digest: '+oldshadigest)
          put('latest',candidate,ctype)
          assert read('latest')[2]==digest,'Promoted digest mismatch'
          assert read('sha-5fb81c5')[2]==digest,'Immutable candidate changed'
          assert read('sha-88c226a')[2]==oldshadigest,'Immutable baseline changed'
          print('Verified latest is byte-identical to sha-5fb81c5; no image build performed.')
