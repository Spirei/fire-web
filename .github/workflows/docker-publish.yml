name: Build and publish Alcor image
run-name: "${{ github.event_name == 'push' && github.event.head_commit.message || github.event_name == 'pull_request' && github.event.pull_request.title || inputs.verify_only && 'Check Alcor image' || 'Build and publish Alcor image' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 香港时间每天 00:07（UTC 前一日 16:07）检查；有新提交才发布，避开整点调度高峰。
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: 原请求 UUID 回执
        required: false
        type: string
      expected_revision:
        description: 本次确认的 main 提交，变化时停止
        required: false
        type: string
      verify_only:
        description: 仅执行完整构建检查，不发布
        required: false
        type: boolean
        default: false

concurrency:
  # 保留队列中的推送，避免连续提交时互相取消并产生大量失败/取消记录。
  group: fire-image-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'publish' || github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    name: 源码与启动快检
    needs: scheduled-change-gate
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.scheduled-change-gate.outputs.should_publish == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      - name: Install internal backend dependencies
        working-directory: platform
        run: uv sync --frozen --python 3.12
      - name: Install image runtime library
        run: sudo bash scripts/ci-install-apt.sh libcairo2
      - name: Install dependencies
        run: npm ci
      - name: Quick source and startup checks
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run check:quick

  test:
    name: 完整平台检查 (${{ matrix.shard }})
    needs: [preflight, scheduled-change-gate]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (github.event_name == 'push' || github.event_name == 'pull_request' || needs.scheduled-change-gate.outputs.should_publish == 'true') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check commit titles
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run check:commit-title -- "${PR_BASE_SHA:-$BEFORE_SHA}" "$HEAD_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      - name: Install internal backend dependencies
        working-directory: platform
        run: uv sync --frozen --python 3.12
      - name: Install isolated cache and image runtime libraries
        run: sudo bash scripts/ci-install-apt.sh redis-server libcairo2
      - name: Install dependencies
        run: npm ci
      - name: Complete internal PostgreSQL and Worker regression
        working-directory: platform
        env:
          FIRE_TEST_REDIS_BINARY: /usr/bin/redis-server
        run: uv run python tools/test-shard.py --index ${{ matrix.shard }} --count 8
      - name: Production build check
        if: matrix.shard == 0
        run: npm run build
      - name: Build Linux candidate without publishing
        if: matrix.shard == 0
        run: docker build --build-arg FIRE_BUILD_SHA=${{ github.sha }} --tag fire-candidate:check .
      - name: Verify packaged Python, SVG, Node and PG tools
        if: matrix.shard == 0
        run: |
          docker run --rm --entrypoint /platform/.venv/bin/python fire-candidate:check -c 'import os, tempfile; from pathlib import Path; assert os.getuid()==1000; tempfile.TemporaryFile(dir=Path.home()).close(); assert (Path(os.environ["FIRE_PG_TOOLS_DIR"])/"pg_dump").is_file(); import fastapi, psycopg, redis, futu; from cairosvg import svg2png; assert svg2png(bytestring=b"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1\" height=\"1\"/>").startswith(b"\x89PNG")'
          docker run --rm -e FIRE_DATABASE_URL=postgresql://fixture:fixture@localhost/fixture -e FIRE_INSTANCE_ID=a1aee7e9-665a-4af1-879f-f951a21ed946 -e FIRE_ENVIRONMENT=test -e FIRE_PUBLIC_ORIGIN=http://localhost:3000 fire-candidate:check npm run platform:config
          docker run --rm --entrypoint node fire-candidate:check -e 'require("next/package.json")'
          docker run --rm --tmpfs /app/public/uploads --entrypoint node fire-candidate:check -e 'const fs=require("fs"); for(const name of require("./contracts/system-media.json")){if(!fs.statSync("/app/public/fire-assets/system/"+name).size)process.exit(1)}'
          docker run --rm --entrypoint /usr/lib/postgresql/17/bin/pg_dump fire-candidate:check --version

  scheduled-change-gate:
    name: Check scheduled source changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
      schema: ${{ steps.gate.outputs.schema }}
      image: ${{ steps.gate.outputs.image }}
    steps:
      - name: "Build request receipt · ${{ inputs.request_id }}"
        if: github.event_name == 'workflow_dispatch' && inputs.request_id != ''
        run: echo 'Publication request receipt recorded.'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether image should be built
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          REQUEST_ID: ${{ inputs.request_id }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: node scripts/check-image-published.mjs

  publish:
    name: Publish linux/amd64 image
    needs: [test, scheduled-change-gate]
    # 提交/PR 只检查；定时和手动任务仅在当前 main 尚无镜像时发布。
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && !inputs.verify_only && needs.scheduled-change-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FIRE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 发布不可变版本清单
    needs: [scheduled-change-gate, publish]
    if: github.ref == 'refs/heads/main' && needs.publish.result == 'success' && !inputs.verify_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Write immutable release identity
        env:
          IMAGE: ${{ needs.scheduled-change-gate.outputs.image }}@${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.scheduled-change-gate.outputs.version }}
          SCHEMA: ${{ needs.scheduled-change-gate.outputs.schema }}
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          value={'version':os.environ['VERSION'],'image':os.environ['IMAGE'],'revision':os.environ['REVISION'],'schema_hash':os.environ['SCHEMA']}
          assert re.fullmatch(r'ghcr.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}',value['image'])
          assert re.fullmatch(r'[a-f0-9]{40}',value['revision']) and re.fullmatch(r'[a-f0-9]{64}',value['schema_hash'])
          assert re.fullmatch(r'\d+\.\d+\.\d+',value['version'])
          Path('release-manifest.json').write_text(json.dumps(value))
          PY
      - name: Publish immutable release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.scheduled-change-gate.outputs.version }}
          REVISION: ${{ github.sha }}
        run: gh release create "fire-v${VERSION}-${REVISION}" --target "$REVISION" --title "Fire ${VERSION}" --notes-file release-manifest.json --latest
