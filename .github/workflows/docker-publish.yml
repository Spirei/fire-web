name: Build and publish Fire image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 香港时间每天 00:07（UTC 前一日 16:07）发布；避开 GitHub Actions 整点调度高峰。
    - cron: "7 16 * * *"
  workflow_dispatch:

concurrency:
  # 保留队列中的推送，避免连续提交时互相取消并产生大量失败/取消记录。
  group: fire-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Public repository safety audit
        run: npm run audit:public
      - name: Local and GHCR deployment parity audit
        run: npm run audit:deploy
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build check
        run: npm run build

  scheduled-change-gate:
    name: Check scheduled source changes
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Decide whether image should be built
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "每日定时发布：即使 main 提交未变化，也重新生成当天镜像。"
            exit 0
          fi
          last_sha=$(gh api "repos/${REPOSITORY}/actions/workflows/docker-publish.yml/runs?status=success&per_page=30" --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // ""')
          if [ "$last_sha" = "$CURRENT_SHA" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "当前 main 提交已有可用镜像，跳过重复构建。"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "检测到 main 新提交，继续构建镜像。"
          fi

  publish:
    name: Publish linux/amd64 image
    needs: [test, scheduled-change-gate]
    # 提交/PR 只检查；定时任务每日发布，手动任务仍避免重复构建同一提交。
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.scheduled-change-gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FIRE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
