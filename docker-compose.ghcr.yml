services:
  fire:
    # 在 .env 中设置 GHCR_IMAGE，例如 ghcr.io/your-github-name/fire-web。
    image: ${GHCR_IMAGE:?请在 .env 中设置 GHCR_IMAGE}:${IMAGE_TAG:-latest}
    container_name: fire
    restart: unless-stopped
    hostname: fire
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      FIRE_PUBLIC_ORIGIN: ${FIRE_PUBLIC_ORIGIN:?请填写实际访问地址}
      FIRE_ENVIRONMENT: ${FIRE_ENVIRONMENT:?请填写与数据库一致的环境}
      FIRE_INSTANCE_ID: ${FIRE_INSTANCE_ID:?请先核对并填写数据库实例UUID}
      FIRE_DATABASE_URL: ${FIRE_DATABASE_URL:?请填写实际PG连接}
      FIRE_CONNECTION_SECRET_DIR: /private/state/connection-secrets
      FIRE_FILE_ROOT: /private/files
      FIRE_ASSET_ROOT: /private/assets
      FIRE_BACKUP_DIR: /private/backups
      FIRE_BACKUP_SECRET_DIR: /private/backup-key
      FIRE_DEPLOYMENT_UPDATER_URL: http://fire-updater:8080/v1/update
      FIRE_DEPLOYMENT_RUNNER_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?请填写独立更新器令牌}
      FIRE_PYTHON: /platform/.venv/bin/python
    env_file:
      - path: .env
        required: true
    volumes:
      - ${FIRE_PRIVATE_DIR:?请填写私有运行目录}:/private
      - ${UPLOADS_DIR:-./uploads}:/app/public/uploads
      # 插图 / 字体 / 图标 / 分享图不进仓库也不进镜像（见 ASSETS.md），由部署者放在宿主机目录后挂进来。
      # 少了这些目录不会影响服务运行，但自定义插图、字体与图标会是 404；FIRE 必需鱼素材独立随镜像提供。
      # 目录为空或不挂载时行为与旧版一致，先把文件放进对应目录、再 up -d --force-recreate 即可生效。
      - ${IMAGES_DIR:-./images}:/app/public/images:ro
      - ${FONTS_DIR:-./fonts}:/app/public/fonts:ro
      - ${ICONS_DIR:-./icons}:/app/public/icons:ro
      - ${SHARE_DIR:-./share}:/app/public/share:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "fire"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 40s

  fire-updater:
    networks:
      - platform
    image: containrrr/watchtower:1.7.1
    container_name: fire-updater
    restart: unless-stopped
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?请在 .env 中设置 WATCHTOWER_HTTP_API_TOKEN}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: fire
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "fire"

networks:
  platform:
    external: true
    name: ${FIRE_NETWORK:?请填写数据库所在网络}
