services:
  fire:
    # 在 .env 中设置 GHCR_IMAGE，例如 ghcr.io/your-github-name/fire-web。
    image: ${GHCR_IMAGE:?请在 .env 中设置 GHCR_IMAGE}:${IMAGE_TAG:-latest}
    container_name: fire
    restart: unless-stopped
    hostname: fire
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      FIRE_UPDATER_URL: http://fire-updater:8080/v1/update
    env_file:
      - path: .env
        required: false
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${UPLOADS_DIR:-./uploads}:/app/public/uploads
      # 插图 / 字体 / 图标 / 分享图不进仓库也不进镜像（见 ASSETS.md），由部署者放在宿主机目录后挂进来。
      # 少了这些目录不会影响服务运行，但 FIRE 页面的小丑鱼与礁石贴图、自定义字体与图标都会是 404。
      # 目录为空或不挂载时行为与旧版一致，先把文件放进对应目录、再 up -d --force-recreate 即可生效。
      - ${IMAGES_DIR:-./images}:/app/public/images:ro
      - ${FONTS_DIR:-./fonts}:/app/public/fonts:ro
      - ${ICONS_DIR:-./icons}:/app/public/icons:ro
      - ${SHARE_DIR:-./share}:/app/public/share:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "fire"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/settings/public').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 40s

  fire-updater:
    image: containrrr/watchtower:1.7.1
    container_name: fire-updater
    restart: unless-stopped
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?请在 .env 中设置 WATCHTOWER_HTTP_API_TOKEN}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: fire
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "fire"
