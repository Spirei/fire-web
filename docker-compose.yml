services:
  fire:
    build:
      context: .
      dockerfile: Dockerfile
    image: fire:latest
    container_name: fire
    restart: unless-stopped
    hostname: fire
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    # 生产环境密钥 / 首次建库管理员（密码需 8-128 位且含字母与数字）
    env_file:
      - path: .env
        required: false
    volumes:
      # 与 GHCR 部署使用相同的变量；未配置时仍使用项目内 ./data 与 ./uploads。
      - ${DATA_DIR:-./data}:/app/data
      - ${UPLOADS_DIR:-./uploads}:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/settings/public').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 40s
