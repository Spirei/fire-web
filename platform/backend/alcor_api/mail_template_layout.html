<!doctype html><html lang="zh-CN"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark"><style>@media(max-width:480px){.mail-container{padding:20px 18px!important}.mail-body{padding:26px 8px 0!important}.mail-title{font-size:25px!important;margin-bottom:28px!important}.mail-copy{font-size:16px!important}.mail-value{padding:26px 12px!important}.mail-code{font-size:35px!important;letter-spacing:5px!important}.mail-alert-price{font-size:32px!important}.mail-signature{margin-top:32px!important}}$dark_css</style></head><body style="margin:0;background:#fff;color:$body_color;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center"><table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;width:100%;table-layout:fixed"><tr><td class="mail-container" style="padding:36px 38px"><img class="mail-banner" src="$banner" alt="$banner_alt" width="564" style="display:block;width:100%;height:auto;border-radius:12px"><div class="mail-body" style="padding:38px 16px 0"><h1 class="mail-title" style="font-size:30px;line-height:1.35;font-weight:600;letter-spacing:.5px;color:$title_color;margin:0 0 34px">$title</h1>$greeting<p class="mail-copy" style="overflow-wrap:anywhere;font-size:17px;line-height:1.85;margin:0 0 28px">$paragraph</p><div class="mail-value" style="padding:30px 16px 34px;background:$panel_color;border:1px solid $border_color;border-radius:14px;text-align:center">$value</div>$token$metadata$signature</div></td></tr></table></td></tr></table></body></html>
