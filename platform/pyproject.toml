[project]
name = "fire-platform"
version = "0.1.78"
description = "Fire internal backend and durable workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5.2,<7",
  "supervisor>=4.2,<5",
  "pillow>=12.0,<14",
  "cryptography>=46,<50",
  "webauthn>=2.2,<3",
  "qrcode>=8,<9",
  "idna>=3,<4",
  "httpx>=0.28,<1",
  "httpcore>=1.0,<2",
  "regex>=2026.9.29,<2027",
  "python-multipart>=0.0.33,<0.1",
  "fonttools>=4.60,<5",
  "brotli>=1.2,<2",
  "cairosvg>=2.8,<3",
]

[project.optional-dependencies]
futu = ["futu-api==10.12.7208"]

[project.scripts]
fire-platform = "alcor_api.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/alcor_api"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pgserver==0.1.4",
    "ruff>=0.11,<1",
    "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110
