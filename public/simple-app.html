<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Fire 简化版</title>
  <style>
    :root {
      --ink: #262626;
      --muted: #8c8c8c;
      --faint: #bfbfbf;
      --bg: #ffffff;
      --page: #f5f5f5;
      --gray: #fafafa;
      --line: #f0f0f0;
      --card: #ffffff;
      --chip: #f3f3f3;
      --input: #f6f6f6;
      --sheet: #ffffff;
      --ghost-bd: #dddddd;
      --seg: #f3f5f7;
      --dash: #d8d8d8;
      --toggle: #e6e6e6;
      --knob: #ffffff;
      --ok-off: #d7eefc;
      --ok-off-t: #9ec9e6;
      --add-head: #eaf3f8;
      --ex-t: #c8c8c8;
      --lab: #888888;
      --red: #e55f5c;
      --green: #2eb789;
      --blue: #22a3ff;
      --lav: #edebf6;
      --lav-2: #f5f4f9;
      --bar: #a4a2d4;
      --tab: #a4a2d4;
      --invest: #def1ff;
      --cash: #f9ece6;
      --cash-t: #ab5c35;
      --chip-p: #e5e5f1;
      --chip-t: #deecec;
      --chip-y: #f3ead6;
      --s-green: #c8e9de;
      --s-purple: #d5d4e4;
      --weather: #f2faeb;
      --in: #e9ecfd;
      --out: #fdeee7;
      --chart-p: #7a5ea7;
      --body-bg: #ececec;
      --win-shadow: 0 12px 40px rgba(0,0,0,.12);
      --mask: rgba(0,0,0,.45);
      --w: 600px;
    }
    html.dark {
      --ink: #eef1f6;
      --muted: #99a3b2;
      --faint: #677183;
      --bg: #151b26;
      --page: #0f141e;
      --gray: #1c222d;
      --line: #252c3a;
      --card: #1c222d;
      --chip: #252c3a;
      --input: #1a2230;
      --sheet: #1c222d;
      --ghost-bd: #323a4b;
      --seg: #252c3a;
      --dash: #3a4354;
      --toggle: #323a4b;
      --knob: #eef1f6;
      --ok-off: #1a3348;
      --ok-off-t: #5a7a90;
      --add-head: #1a2833;
      --ex-t: #5a6472;
      --lab: #8b95a6;
      --lav: #2a2740;
      --lav-2: #242236;
      --invest: #1a3348;
      --cash: #3a2c26;
      --cash-t: #e0a07a;
      --chip-p: #2c2a40;
      --chip-t: #243834;
      --chip-y: #3a3424;
      --s-green: #1e3d34;
      --s-purple: #2f2d48;
      --weather: #243028;
      --in: #252a40;
      --out: #3a2a24;
      --body-bg: #0a0e19;
      --win-shadow: 0 16px 48px rgba(0,0,0,.45);
      --mask: rgba(0,0,0,.62);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100dvh; background: var(--body-bg); overflow: hidden; }
    body {
      color: var(--ink);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", "Helvetica Neue", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    input, select, textarea { background: var(--input); border: 0; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    .win {
      position: fixed; left: 0; top: 0; z-index: 20;
      width: var(--w); height: auto; max-height: calc(100dvh - 48px);
      display: flex; flex-direction: column;
      background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--win-shadow); overflow: hidden;
    }
    .win.is-fixed { box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    html.dark .win.is-fixed { box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .win-bar {
      flex: none; height: 42px; display: flex; align-items: center; gap: 10px;
      padding: 0 12px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none;
      background: var(--bg); color: var(--ink);
    }
    .win.is-fixed .win-bar { cursor: default; }
    .win-bar:active { cursor: grabbing; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; }
    .win-title { flex: 1; font-size: 13px; font-weight: 650; color: var(--muted); }
    .win-bar button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
    .win-bar button:hover { background: var(--gray); }
    .win-bar button.is-on { color: var(--ink); }
    .win-body {
      flex: 1; min-height: 0; overflow: hidden; background: var(--bg);
      scrollbar-width: thin; scrollbar-color: var(--dash) var(--bg);
    }
    .win-body.can-y { overflow-y: auto; }
    .win-body.has-dock { padding-bottom: 76px; }
    .dock {
      position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 22;
      display: none; pointer-events: none;
    }
    .dock.on { display: block; }
    .dock .cta, .dock .fab { pointer-events: auto; }
    .dock .cta {
      margin: 0; width: 100%; height: 48px; border-radius: 24px;
      background: var(--blue); color: #fff; font-size: 16px; font-weight: 650;
      box-shadow: 0 10px 28px rgba(34,163,255,.4);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    .dock .cta:hover { filter: brightness(1.05); }
    .dock .cta:active { transform: scale(.975); box-shadow: 0 4px 14px rgba(34,163,255,.28); }
    .dock .fab {
      margin: 0 auto; box-shadow: 0 10px 24px rgba(34,163,255,.4);
      transition: transform .16s ease;
    }
    .dock .fab:active { transform: scale(.94); }
    .sk-full {
      position: absolute; inset: 42px 0 0 0; z-index: 18; display: none;
      flex-direction: column; background: #0c0c0e; color: #eee;
    }
    .sk-full.on { display: flex; }
    .sk-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; }
    .sk-bar h2 { margin: 0; font-size: 17px; font-weight: 700; flex: none; }
    .sk-bar .grow { flex: 1; }
    .sk-dd { height: 28px; padding: 0 10px; border-radius: 8px; background: #1c1c1e; color: #ddd; font-size: 13px; }
    .sk-modes { display: flex; background: #1c1c1e; border-radius: 10px; padding: 3px; }
    .sk-modes button { height: 26px; padding: 0 10px; border-radius: 8px; color: #8e8e93; font-size: 13px; }
    .sk-modes button.on { background: #2c2c2e; color: #fff; }
    .sk-ico { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #ccc; }
    .sk-ico:hover { background: #1c1c1e; }
    .sk-view {
      flex: 1; min-height: 0; overflow: auto; cursor: grab;
      -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y;
    }
    .sk-view:active { cursor: grabbing; }
    .sk-view::-webkit-scrollbar { height: 6px; width: 6px; }
    .sk-view::-webkit-scrollbar-thumb { background: #333; border-radius: 6px; }
    .sk-canvas { display: block; min-height: 100%; }
    .mems { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; margin: 48px 16px 24px; }
    .mem { text-align: center; min-width: 88px; }
    .avatar {
      width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 10px;
      background: #f3b184; position: relative; overflow: hidden;
    }
    .avatar::before { content: ""; position: absolute; left: 14px; right: 14px; top: -6px; height: 28px; background: #f7f3ee; border-radius: 0 0 20px 20px; }
    .avatar .dot { position: absolute; top: 34px; width: 6px; height: 6px; border-radius: 50%; background: #4a3a32; }
    .avatar .dot.l { left: 24px; } .avatar .dot.r { right: 24px; }
    .avatar .smile { position: absolute; left: 28px; right: 28px; bottom: 18px; height: 10px; border-bottom: 2px solid #4a3a32; border-radius: 0 0 10px 10px; }
    .mem-add {
      width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 10px;
      border: 1.5px dashed var(--dash); display: grid; place-items: center;
      font-size: 30px; color: var(--faint); background: transparent;
    }
    .mem b { display: block; font-weight: 500; }
    .mem .sub { color: var(--faint); font-size: 13px; }
    button, .pill, .cat, .acct, .mini, .ghost-btn {
      transition: transform .14s ease, background .14s ease, border-color .14s ease, opacity .14s ease;
    }
    .pill:active, .cat:active, .acct:active, .mini:active { transform: scale(.98); }
    .win-body::-webkit-scrollbar { width: 8px; height: 0; }
    .win-body::-webkit-scrollbar-track { background: var(--bg); }
    .win-body::-webkit-scrollbar-thumb { background: var(--dash); border-radius: 8px; }
    .scroll-x { overflow-x: auto; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { height: 0; }
    .handle { position: absolute; width: 14px; height: 14px; z-index: 5; }
    .handle.nw { left: 0; top: 0; cursor: nwse-resize; }
    .handle.ne { right: 0; top: 0; cursor: nesw-resize; }
    .handle.sw { left: 0; bottom: 0; cursor: nesw-resize; }
    .handle.se { right: 0; bottom: 0; cursor: nwse-resize; }
    .win.is-fixed .handle { display: none; }
    .screen { display: none; padding-bottom: 20px; background: var(--bg); width: 100%; max-width: 100%; overflow: hidden; position: relative; }
    .screen.on { display: block; }
    .screen.gray { background: var(--page); }
    .head { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 8px 12px 4px 8px; position: relative; }
    .head h1 { margin: 0; flex: 1; min-width: 0; font-size: 22px; font-weight: 750; line-height: 1.25; }
    .head .right, .head .grow { display: flex; align-items: center; gap: 12px; margin-left: auto; flex: none; }
    .head .grow { flex: 1; }
    h1.page-title { margin: 4px 16px 12px; font-size: 26px; font-weight: 750; }
    .theme-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
    .theme-btn:hover { background: var(--gray); }
    .add-head { background: var(--add-head); padding: 12px 16px 18px; }
    .add-head h1 { margin: 12px 0 14px; color: var(--ink); }
    .ex { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .ex-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ex-chip { background: var(--card); border-radius: 12px; padding: 10px 14px; color: var(--ex-t); font-size: 13px; text-align: left; border: 1px solid var(--line); }
    .ex-chip small { display: block; margin-top: 2px; font-size: 11px; }
    .add-body { background: var(--bg); border-radius: 20px 20px 0 0; margin-top: -8px; padding: 20px 16px 16px; }
    .field { margin-bottom: 22px; }
    .field label { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--ink); }
    .field input, .field select {
      width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--input);
      padding: 0 16px; outline: none; font-size: 16px; color: var(--ink);
    }
    .types { display: flex; gap: 10px; }
    .types button {
      flex: 1; height: 40px; border: 1px solid var(--ghost-bd); border-radius: 20px;
      background: var(--card); color: var(--ink);
    }
    .types button.on { border-color: var(--ink); font-weight: 650; }
    .more { color: var(--ink); font-size: 14px; font-weight: 650; padding: 8px 0 16px; }
    .ok-btn { width: 100%; height: 48px; border-radius: 24px; background: var(--ok-off); color: var(--ok-off-t); font-size: 16px; font-weight: 650; }
    .ok-btn.ready { background: var(--blue); color: #fff; }
    .bar {
      height: 44px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; font-size: 14px; font-weight: 600; color: var(--ink); position: relative;
    }
    .bar .mid { position: absolute; left: 50%; transform: translateX(-50%); }
    .bar .right { display: flex; align-items: center; gap: 14px; color: var(--ink); font-weight: 400; }
    .back { width: 32px; height: 32px; display: grid; place-items: center; font-size: 22px; line-height: 1; color: var(--ink); }
    .pad { padding: 0 16px; }
    h1 { margin: 4px 16px 16px; font-size: 26px; font-weight: 750; letter-spacing: .02em; color: var(--ink); }
    .eye { opacity: .55; font-size: 18px; }
    .card { border-radius: 18px; background: var(--card); color: var(--ink); }
    .lav { background: var(--lav-2); }
    .lav-deep { background: var(--lav); }
    .inv-home { background: var(--card); box-shadow: 0 1px 0 var(--line); }
    .shadow { box-shadow: 0 1px 0 rgba(0,0,0,.02); }
    .red { color: var(--red); } .green { color: var(--green); }
    .muted { color: var(--muted); } .faint { color: var(--faint); }
    .cta {
      display: block; margin: 20px 16px 4px; width: auto; height: 48px; border-radius: 24px;
      background: var(--blue); color: #fff; font-size: 16px; font-weight: 650;
      box-shadow: 0 8px 20px rgba(34,163,255,.28);
    }
    .fab {
      display: grid; place-items: center; margin: 20px auto 8px;
      width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 26px; box-shadow: 0 8px 20px rgba(34,163,255,.35);
    }
    .row-card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; color: var(--ink); }
    .split { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .k { font-size: 12px; color: var(--muted); }
    .n { font-size: 28px; font-weight: 750; letter-spacing: -.03em; color: var(--ink); }
    .n small { font-size: 14px; font-weight: 500; margin-left: 2px; }
    .pills { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; flex-wrap: nowrap; }
    .pill { height: 32px; padding: 0 16px; border-radius: 16px; background: var(--chip); color: var(--muted); font-size: 14px; }
    .pill.on { background: var(--tab); color: #fff; }
    .manage { margin-left: auto; flex: none; color: var(--muted); font-size: 14px; padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; }
    .cats { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 4px 16px 16px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-next { flex: none; color: var(--faint); padding: 0 4px; font-size: 16px; }
    .cat { flex: none; width: 132px; min-height: 72px; padding: 12px; border-radius: 14px; background: var(--chip); text-align: center; color: var(--ink); }
    .cat b { display: block; font-size: 14px; font-weight: 650; }
    .cat span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .cat.on-cash { background: var(--cash); color: var(--cash-t); }
    .cat.on-cash span { color: var(--cash-t); }
    .cat.on-inv { background: var(--lav); color: #8b86c8; }
    html.dark .cat.on-inv { color: #b7b3e0; }
    .cat.on-debt { background: var(--chip); }
    .hint { margin: 0 16px 12px; padding: 12px 14px; border-radius: 12px; background: var(--cash); color: var(--cash-t); font-size: 14px; display: flex; justify-content: space-between; width: calc(100% - 32px); }
    .hint.plain { background: var(--gray); color: var(--ink); }
    .me { margin: 0 16px; color: #6b67a8; font-weight: 750; font-size: 16px; }
    html.dark .me { color: #b7b3e0; }
    .acct { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 14px; padding: 16px; margin: 8px 16px; color: var(--ink); }
    .acct b { font-weight: 500; }
    .acct .amt { text-align: right; white-space: nowrap; }
    .acct small { display: block; margin-top: 4px; color: var(--faint); font-size: 12px; }
    .add-dash { margin: 18px 16px; padding: 16px; border: 1px dashed var(--dash); border-radius: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; background: transparent; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
    .mini { background: var(--card); border-radius: 18px; padding: 16px; min-height: 168px; box-shadow: 0 0 0 1px var(--line); color: var(--ink); }
    .weather { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--weather); color: var(--ink); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    .toggle { width: 42px; height: 24px; border-radius: 12px; background: var(--toggle); position: relative; display: inline-block; vertical-align: middle; }
    .toggle i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px #0002; }
    .toggle.on { background: var(--bar); } .toggle.on i { left: 20px; }
    .inner { background: var(--card); border-radius: 14px; padding: 14px; margin-top: 12px; color: var(--ink); }
    .bars { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: 86px; gap: 6px; margin-top: 8px; }
    .bars span { display: block; height: 2px; background: var(--line); border-radius: 2px; }
    .bars span.up { background: var(--bar); }
    .bars + .labs { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--lab); text-align: center; margin-top: 6px; }
    .bars + .labs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sankey { width: 100%; max-width: 520px; height: 188px; margin: 4px auto 8px; overflow: hidden; }
    .sankey svg { width: 100%; height: 188px; display: block; }
    .spark { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; height: 72px; gap: 10px; }
    .spark i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--line); height: 3px; }
    .spark i.up { background: var(--bar); }
    .spark .arr { display: block; text-align: center; font-size: 12px; color: var(--faint); line-height: 1; margin-bottom: 4px; }
    .spark .arr.hot { color: var(--red); }
    .cmp { display: flex; gap: 18px; margin: 12px 0; }
    .cmp .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; background: var(--lav); flex: none; }
    .delta-bars { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: 72px; gap: 6px; margin-top: 4px; }
    .delta-bars > div { min-width: 0; text-align: center; }
    .delta-bars b { display: block; font-size: 10px; font-weight: 600; color: var(--red); min-height: 14px; }
    .delta-bars i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--line); height: 2px; }
    .delta-bars i.on { background: var(--bar); }
    .delta-bars span { display: block; font-size: 10px; color: var(--lab); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid currentColor; font-size: 10px; opacity: .55; margin-left: 2px; vertical-align: 1px; }
    .chip-mini { display: inline-block; background: var(--invest); color: var(--blue); border-radius: 4px; padding: 1px 6px; font-size: 11px; margin-right: 6px; }
    .tree { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: 14px; }
    .tree-row { display: flex; gap: 10px; justify-content: center; width: 100%; }
    .tree-row .box { flex: 1; max-width: 150px; background: var(--gray); border-radius: 12px; padding: 12px 8px; text-align: center; color: var(--ink); }
    .tree-join { width: 56%; height: 18px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0 0 12px 12px; opacity: .7; }
    .comp { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; }
    .comp > div { min-width: 0; background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); color: var(--ink); }
    .exp {
      width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      color: var(--muted); background: rgba(128,128,128,.12); border: 0; padding: 0;
    }
    .exp:hover { color: var(--ink); background: rgba(128,128,128,.2); }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
    .trend-legend label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .trend-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .trend-tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-top: 10px; }
    .trend-tabs button { height: 36px; color: var(--muted); }
    .trend-tabs button.on { color: var(--blue); font-weight: 650; }
    .trend-svg { width: 100%; height: 180px; display: block; }
    .sheet-form .cap { text-align: center; font-weight: 650; flex: 1; }
    .sheet-form .nick { font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
    .sheet-form input {
      width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--input);
      padding: 0 14px; margin: 0 0 22px;
    }
    .sheet-form .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; font-size: 14px; }
    .sheet-done { width: 100%; height: 48px; border-radius: 24px; background: var(--ok-off); color: var(--ok-off-t); font-size: 16px; font-weight: 650; }
    .sheet-done.ready { background: var(--blue); color: #fff; }

<script>
const KEY = "fire-simple-book-v3";

const EXAMPLES = {

const CURS = [
  { code: "CNY", name: "人民币", unit: "元" },

let S = load();
let route = { name: "home", cat: "cash", member: "全部", chartKind: "mwr", chartRange: "all", showAll: false };
let updateTarget = null;

function uid() { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) {
  const x = d instanceof Date ? d : new Date(d);

}
function today() { return iso(new Date()); }
function pretty(s) {
  if (!s) return "";
  const p = String(s).slice(0, 10).split("-");
  if (p.length < 3) return s;
  return p[0] + "." + p[1] + "." + p[2];
}
function md(s) {
  const p = String(s || "").slice(0, 10).split("-");
  if (p.length < 3) return s || "";
  return Number(p[1]) + "月" + Number(p[2]) + "日";
}
function zhDate(s) {
  const p = String(s || "").slice(0, 10).split("-");
  if (p.length < 3) return s || "";
  return p[0] + "年" + Number(p[1]) + "月" + Number(p[2]) + "日";
}
function parseDay(s) {
  const t = Date.parse(String(s || "").slice(0, 10));
  return Number.isFinite(t) ? t : 0;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"'`]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;", "`": "&#96;" }[c]));
}
function normalize(raw) {
  const p = raw && typeof raw === "object" ? raw : {};
  const next = { ...EMPTY, ...p, fx: { ...EMPTY.fx, ...(p.fx || {}) }, cashflow: { ...EMPTY.cashflow, ...(p.cashflow || {}) } };
  for (const k of ["cash", "fixed", "receivable", "debt", "invest", "snaps", "logs", "members"]) next[k] = Array.isArray(p[k]) ? p[k] : [];
  if (!next.members.length) next.members = [{ id: "me", name: "我" }];
  next.invest = next.invest.map((a) => ({ inAmt: a.inAmt || 0, outAmt: a.outAmt || 0, hist: Array.isArray(a.hist) ? a.hist : [], bucket: a.bucket || "长期", ...a }));
  return next;
}
function isEmptyBook(b) {
  return !b.cash.length && !b.fixed.length && !b.receivable.length && !b.debt.length && !b.invest.length;
}
function load() {
  try {
    const v3 = localStorage.getItem(KEY);
    if (v3) return normalize(JSON.parse(v3));
    const v2 = localStorage.getItem(KEY_OLD);
    if (v2) return normalize(JSON.parse(v2));
  } catch {}
  return normalize(null);
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function save() {
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 450);
}
function bookEmpty(b) { return isEmptyBook(b || S); }
async function hydrate() {
  try {
    const r = await fetch("/api/v1/simple-ledger", { credentials: "same-origin" });
    if (!r.ok) return;
    loggedIn = true;
    const j = await r.json();
    const remote = normalize(j.data || j);
    if (!isEmptyBook(remote)) {
      S = remote;
      saveLocal();
      render();
    } else if (!isEmptyBook(S)) {
      pushRemote();
    }
    pullRates();
  } catch {}
}
async function pushRemote() {
  if (!loggedIn) {
    try {
      const r = await fetch("/api/v1/simple-ledger", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) });
      loggedIn = r.ok;
    } catch {}
    return;
  }
  try {
    await fetch("/api/v1/simple-ledger", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) });
  } catch {}
}
async function pullRates() {
  try {
    const r = await fetch("/api/rates", { credentials: "same-origin" });
    if (!r.ok) return;
    const j = await r.json();
    const rates = j.rates || {};
    if (!rates.CNY) return;
    S.fx.CNY = 1;
    S.fx.USD = rates.CNY;
    if (rates.HKD) S.fx.HKD = rates.CNY / rates.HKD;
    saveLocal();
  } catch {}
}
function fxRate(cur) { return (S.fx && S.fx[cur]) || 1; }
function cny(item) { return (Number(item.amount) || 0) * fxRate(item.cur); }
function sum(list) { return (list || []).reduce((n, x) => n + cny(x), 0); }
function money(n, cur) {
  if (S.hide) return "****";
  const abs = Math.abs(n).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = n < 0 ? "-" : "";
  if (cur === "USD") return sign + "$ " + abs;
  if (cur === "HKD") return sign + "HK$ " + abs;
  return sign + "¥ " + abs;
}
function num(n, d) {
  if (S.hide) return "****";
  return Number(n || 0).toLocaleString("zh-CN", { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d });
}
function pct(n) {
  if (n == null || Number.isNaN(n)) return "暂无";
  if (S.hide) return "****";
  const v = Number(n);
  return (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
}
function tone(n) { return !n ? "faint" : n > 0 ? "red" : "green"; }
function signed(n, cur) {
  if (S.hide) return "****";
  const prefix = n > 0 ? "+" : "";
  return prefix + money(n, cur);
}
function signedNum(n) {
  if (S.hide) return "****";
  const prefix = n > 0 ? "+" : "";

}

}
function go(name, extra) {

  render({ resize: PAGE_W[route.name] !== PAGE_W[prev] });
}
function navHead(back, title, right) {
  return `<div class="head">
    <button class="back" type="button" onclick="${back}">‹</button>
    <h1>${title}</h1>
    ${right ? `<div class="right">${right}</div>` : ""}
  </div>`;
}
function hideBtn() {
  const icon = S.hide
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M9.9 5.1A10 10 0 0 1 12 5c5 0 9.3 3.1 11 7.5a11.7 11.7 0 0 1-4.2 4.8M6.1 6.1A11.7 11.7 0 0 0 1 12.5 10.8 10.8 0 0 0 12 19c1.1 0 2.2-.2 3.2-.5"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;

}
function listByCat(cat) { return cat === "invest" ? S.invest : (S[cat] || []); }
function investPnl(a) { return (Number(a.amount) || 0) - ((Number(a.inAmt) || 0) - (Number(a.outAmt) || 0)); }
function investStats(a) {
  const inAmt = Number(a.inAmt) || 0;
  const outAmt = Number(a.outAmt) || 0;
  const net = inAmt - outAmt;
  const pnl = (Number(a.amount) || 0) - net;
  const hist = (a.hist || []).slice().sort((x, y) => String(x.d).localeCompare(String(y.d)));
  const first = hist[0] ? String(hist[0].d).slice(0, 10) : "";
  const last = hist.length ? String(hist[hist.length - 1].d).slice(0, 10) : String(a.updated || "").slice(0, 10);
  const mwr = net > 0 ? (pnl / net) * 100 : null;
  let ytd = null;
  if (first && last && mwr != null) {
    const days = Math.max(1, (parseDay(last) - parseDay(first)) / 86400000);
    if (days >= 7) ytd = (Math.pow(1 + mwr / 100, 365 / days) - 1) * 100;
  }
  return { inAmt, outAmt, net, pnl, mwr, ytd, first, last, hist };
}
function yearMwr(hist, year) {
  const pts = (hist || []).filter((h) => String(h.d).slice(0, 4) === String(year)).sort((a, b) => String(a.d).localeCompare(String(b.d)));
  const before = (hist || []).filter((h) => String(h.d).slice(0, 4) < String(year)).sort((a, b) => String(a.d).localeCompare(String(b.d)));
  if (!pts.length) return null;
  const start = before.length ? Number(before[before.length - 1].v) : 0;
  const end = Number(pts[pts.length - 1].v) || 0;
  const inn = pts.reduce((n, h) => n + (Number(h.inn) || 0), 0);
  const out = pts.reduce((n, h) => n + (Number(h.out) || 0), 0);
  const pnl = end - start - inn + out;
  const avg = start + inn * 0.5 - out * 0.5;
  if (!avg) return null;
  return (pnl / avg) * 100;
}
function thisYearNetIn() {
  const y = String(new Date().getFullYear());
  let n = 0;
  for (const a of S.invest) {
    for (const h of a.hist || []) {
      if (String(h.d).slice(0, 4) !== y) continue;
      n += ((Number(h.inn) || 0) - (Number(h.out) || 0)) * fxRate(a.cur);
    }
  }
  return n;
}
function latestDate() {
  let best = "";
  const scan = (v) => { if (v && String(v).slice(0, 10) > best) best = String(v).slice(0, 10); };
  for (const k of ["cash", "fixed", "receivable", "debt"]) for (const x of S[k]) scan(x.date);
  for (const a of S.invest) { scan(a.updated); for (const h of a.hist || []) scan(h.d); }

  if (days === 1) return "昨天更新";

}

  const rows = list || [];
  if (!route.member || route.member === "全部") return rows;
  return rows.filter((x) => !x.owner || x.owner === route.member);
}

}
function moneyHelp(k) {
  const tips = {
    活钱: "随时能用的钱：流动资金 + 投资里标成「活钱」的账户。",
    稳健: "一到三年不急用、波动较小的投资。",

function totals() {
  const cash = sum(vis(S.cash));

  const inv = invList.reduce((n, x) => n + cny(x), 0);

  const debt = sum(vis(S.debt));

  const net = assets + debt;

  for (const a of invList) buckets[a.bucket || "长期"] = (buckets[a.bucket || "长期"] || 0) + cny(a);
  const last = latestDate();
  const prev = S.snaps.length > 1 ? S.snaps[1] : (S.snaps[0] && S.snaps[0].at !== today() ? S.snaps[0] : null);

}
function captureSnap() {
  const t = totals();
  const snap = { at: today(), assets: t.assets, debt: t.debt, cash: t.cash, fixed: t.fixed, inv: t.inv, rec: t.rec };
  if (S.snaps[0] && S.snaps[0].at === snap.at) S.snaps[0] = snap;
  else S.snaps.unshift(snap);

}
function addLog(cat, item) {

}
function weatherState(t) {
  if (t.empty) return { icon: "阴", title: "尚未记账", desc: "记下第一笔资产后，这里会根据负债率和现金缓冲给出晴雨。" };
  if (t.net < 0) return { icon: "雨", title: "资不抵债", desc: "净资产为负，优先处理高息负债，再谈投资。" };

  if (t.ratio >= 20) return { icon: "阴", title: "转阴", desc: "负债率 " + t.ratio.toFixed(1) + "% ，留意还款节奏和现金流。" };
  const spend = (Number(S.cashflow.stable) || 0) + (Number(S.cashflow.flex) || 0);
  if (spend > 0 && t.cash < spend * 3) return { icon: "阴", title: "现金偏紧", desc: "流动资金不足 3 个月支出，先补安全垫。" };
  if (t.ratio === 0 && t.assets > 0) return { icon: "晴", title: "晴好", desc: "没有负债，资产结构干净。继续保持更新节奏。" };

function barH(v, max, cap) {
  if (!max) return 2;
  return Math.max(2, Math.round(Math.abs(v) / max * (cap || 70)));
}
function poly(values, x0, x1, y0, y1) {
  if (!values.length) return "";
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const span = max - min || 1;
  return values.map((v, i) => {
    const x = values.length === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (values.length - 1);
    const y = y1 - (v - min) / span * (y1 - y0);
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
}
function filterHist(hist, range) {
  const now = new Date();
  const all = (hist || []).slice().sort((a, b) => String(a.d).localeCompare(String(b.d)));
  if (range === "ytd") return all.filter((h) => String(h.d).slice(0, 4) === String(now.getFullYear()));
  if (range === "1y") {
    const cut = new Date(now); cut.setFullYear(now.getFullYear() - 1);
    return all.filter((h) => parseDay(h.d) >= cut.getTime());
  }
  if (range === "future") return all.slice(-1);
  if (range === "custom" && route.from && route.to) return all.filter((h) => h.d >= route.from && h.d <= route.to);
  return all;
}
function chartSeries(list, kind) {
  const pts = [];
  let inn = 0, out = 0, start = null;
  for (const h of list) {
    inn += Number(h.inn) || 0;
    out += Number(h.out) || 0;
    if (start == null) start = Number(h.v) || 0;
    const net = inn - out;
    const pnl = (Number(h.v) || 0) - net;
    pts.push(kind === "pnl" ? pnl : (net > 0 ? pnl / net * 100 : 0));
  }
  return pts;
}

function trendSvg() {
  const pts = trendPoints();
  const mode = route.trendMode || "net";
  const on = trendSeriesOn();
  const W = 320, H = 180, L = 42, R = 10, T = 10, B = 24;
  const iw = W - L - R, ih = H - T - B;
  const keys = mode === "net" ? ["net"] : ["cash", "inv", "fixed", "rec", "debt"].filter((k) => on[k]);
  const vals = [];
  pts.forEach((p) => {
    if (mode === "net") vals.push(Number(p.net) || 0);
    else keys.forEach((k) => vals.push(Number(k === "inv" ? p.inv : p[k]) || 0));
  });
  let min = Math.min(0, ...vals);
  let max = Math.max(1, ...vals);
  if (min === max) max = min + 1;
  const yv = (v) => T + ih - (v - min) / (max - min) * ih;
  const xv = (i) => L + (pts.length <= 1 ? iw / 2 : iw * i / (pts.length - 1));
  let grid = "";
  for (let i = 0; i < 5; i++) {
    const v = min + (max - min) * i / 4;
    const yy = yv(v);
    const lab = S.hide ? "****" : (Math.abs(v) >= 10000 ? (v / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(Math.round(v)));
    grid += `<line x1="${L}" x2="${W - R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)"/>`;
    grid += `<text x="2" y="${yy + 3}" font-size="9" fill="var(--muted)">${lab}</text>`;
  }
  const first = pts[0] ? pretty(pts[0].at) : "";
  const last = pts.length ? pretty(pts[pts.length - 1].at) : "";
  grid += `<text x="${L}" y="${H - 6}" font-size="10" fill="var(--faint)">${first}</text>`;
  grid += `<text x="${W - 88}" y="${H - 6}" font-size="10" fill="var(--faint)">${last}</text>`;
  const colors = { net: "#2eb789", cash: "#c47a52", inv: "#6b5ea7", fixed: "#5aa7b8", rec: "#6b8cce", debt: "#8a8a8a" };
  let paths = "";
  const xs = pts.map((_, i) => xv(i));
  if (mode === "net") {
    const ys = pts.map((p) => yv(p.net || 0));
    if (pts.length === 1) paths += `<line x1="${L}" x2="${W - R}" y1="${ys[0]}" y2="${ys[0]}" stroke="${colors.net}" stroke-width="2"/>`;
    else {
      let d = `M${xs[0]},${ys[0]}`;
      for (let i = 1; i < xs.length; i++) d += `L${xs[i]},${ys[i]}`;
      paths += `<path d="${d}L${xs[xs.length - 1]},${yv(0)}L${xs[0]},${yv(0)}Z" fill="${colors.net}" opacity=".88"/>`;
      paths += `<path d="${d}" fill="none" stroke="${colors.net}" stroke-width="1.4"/>`;
    }
  } else {
    const acc = pts.map(() => 0);
    ["cash", "inv", "fixed", "rec"].filter((k) => on[k]).forEach((k) => {
      const top = pts.map((p, i) => acc[i] + (Number(k === "inv" ? p.inv : p[k]) || 0));
      if (pts.length >= 2) {
        let d = `M${xs[0]},${yv(top[0])}`;
        for (let i = 1; i < xs.length; i++) d += `L${xs[i]},${yv(top[i])}`;
        for (let i = xs.length - 1; i >= 0; i--) d += `L${xs[i]},${yv(acc[i])}`;
        paths += `<path d="${d}Z" fill="${colors[k]}" opacity=".92"/>`;
      }
      top.forEach((v, i) => { acc[i] = v; });
    });
    if (on.debt && pts.length >= 2) {
      let d = `M${xs[0]},${yv(pts[0].debt || 0)}`;
      for (let i = 1; i < xs.length; i++) d += `L${xs[i]},${yv(pts[i].debt || 0)}`;
      paths += `<path d="${d}L${xs[xs.length - 1]},${yv(0)}L${xs[0]},${yv(0)}Z" fill="url(#debtHatch)" opacity=".85"/>`;
    }
  }
  return `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><pattern id="debtHatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M0 6L6 0" stroke="#888" stroke-width="1"/></pattern></defs>
    ${grid}${paths}
  </svg>`;
}

function groupedLogs() {

function ribbon(x0, y0, h0, x1, y1, h1) {
  const m = (x0 + x1) / 2;
  return `M${x0},${y0} C${m},${y0} ${m},${y1} ${x1},${y1} L${x1},${y1 + h1} C${m},${y1 + h1} ${m},${y0 + h0} ${x0},${y0 + h0} Z`;
}
function sankeySvg(t) {
  const debtN = S.debt.length;
  const assets = Math.max(t.assets, 1);
  const debtH = t.empty ? 8 : Math.max(6, Math.min(28, Math.abs(t.debt) / assets * 120));
  const netH = 120 - debtH;
  let cashR = t.empty ? 0.18 : t.cash / assets;
  let invR = t.empty ? 0.82 : t.inv / assets;
  const rest = Math.max(0.0001, cashR + invR);
  cashR = Math.max(0.1, cashR / rest);
  invR = 1 - cashR;
  const ch = 120 * cashR;
  const ih = 120 - ch;
  const y0 = 40;
  return `<svg viewBox="0 0 520 188" preserveAspectRatio="xMidYMid meet">
    <text x="8" y="22" font-size="12" fill="var(--muted)">${debtN}项负债</text>
    <rect x="8" y="${y0}" width="90" height="${debtH}" rx="2" fill="var(--dash)"/>
    <path d="M16 ${y0 + debtH + 2} H102 Q124 ${y0 + debtH + 2} 124 ${y0 + debtH + 18} V${y0 + debtH + netH - 8} Q124 ${y0 + debtH + netH} 102 ${y0 + debtH + netH} H16 Z" fill="var(--s-green)"/>
    <rect x="10" y="${y0 + debtH + 2}" width="6" height="${netH - 4}" rx="2" fill="#3cbf8a"/>
    <text x="28" y="${y0 + debtH + netH / 2 + 4}" font-size="13" fill="var(--ink)">净资产</text>
    <text x="148" y="28" font-size="12" fill="#8a86c2">负债 总资产</text>
    <rect x="196" y="${y0}" width="10" height="120" rx="2" fill="var(--bar)"/>
    <path d="${ribbon(206, y0, Math.max(10, ch * 0.35), 350, y0 + 4, Math.max(10, ch * 0.28))}" fill="#e0c4b0"/>
    <path d="${ribbon(206, y0 + Math.max(14, ch * 0.4), ih, 350, y0 + Math.max(22, ch * 0.45), ih)}" fill="var(--s-purple)"/>
    <rect x="348" y="${y0 + 4}" width="5" height="${Math.max(10, ch * 0.28)}" fill="#c47a52"/>
    <text x="360" y="${y0 + 10 + Math.max(10, ch * 0.28) / 2}" font-size="12" fill="var(--cash-t)">流动资金</text>
    <text x="360" y="${y0 + Math.max(22, ch * 0.45) + ih / 2}" font-size="13" fill="#8a86c2">投资理财</text>
  </svg>`;
}

let skState = { mode: "amt" };
function wan(n, base) {
  if (skState.mode === "hide" || S.hide) return "";
  if (skState.mode === "pct") {
    const den = base || totals().assets || 1;
    return (n / den * 100).toFixed(1) + "%";
  }
  const sign = n < 0 ? "-" : "";
  const a = Math.abs(n);
  if (a >= 10000) return sign + (a / 10000).toFixed(2).replace(/\.?0+$/, "") + "万";
  return sign + a.toLocaleString("zh-CN", { maximumFractionDigits: 2 });
}

function bindSkPan(el) {
  if (!el) return;
  let down = false, x0 = 0, y0 = 0, sl = 0, st = 0;
  el.onpointerdown = (e) => {
    if (e.button) return;
    down = true; x0 = e.clientX; y0 = e.clientY; sl = el.scrollLeft; st = el.scrollTop;
    try { el.setPointerCapture(e.pointerId); } catch {}
  };
  el.onpointermove = (e) => {
    if (!down) return;
    el.scrollLeft = sl - (e.clientX - x0);
    el.scrollTop = st - (e.clientY - y0);
  };
  el.onpointerup = el.onpointercancel = () => { down = false; };
}

function drawSankeyFull() {
  const el = document.getElementById("skFull");
  if (!el) return;
  const t = totals();
  const groups = [
    { label: "流动资金", color: "#c47a52", fill: "rgba(196,122,82,.62)", items: vis(S.cash) },
    { label: "投资理财", color: "#6b5ea7", fill: "rgba(92,84,136,.82)", items: vis(S.invest) },
    { label: "固定资产", color: "#8a8a8a", fill: "rgba(140,140,140,.5)", items: vis(S.fixed) },
    { label: "应收款", color: "#7a90a8", fill: "rgba(122,144,168,.5)", items: vis(S.receivable) }
  ].map((g) => {
    const items = g.items.map((x) => ({ name: x.name, v: Math.abs(cny(x)) })).filter((x) => x.v || g.items.length);
    const total = items.reduce((n, x) => n + x.v, 0);
    return { ...g, items, total };
  }).filter((g) => g.total > 0 || g.items.length);
  const leafN = groups.reduce((n, g) => n + Math.max(g.items.length, 1), 0);
  const H = Math.max(340, 72 + leafN * 36);
  const W = 920;
  const yTop = 56, colH = H - 80;
  const assets = Math.max(t.assets, 1);
  const debtAbs = Math.abs(t.debt);
  const debtH = t.empty ? 10 : Math.max(8, Math.min(colH * 0.22, debtAbs / assets * colH));
  const netH = colH - debtH;
  let y = yTop;
  groups.forEach((g) => {
    const share = t.empty ? 1 / Math.max(groups.length, 1) : g.total / assets;
    g.h = Math.max(28, colH * Math.max(share, 0.06));
    g.y = y;
    let iy = y;
    const itemH = g.items.length ? g.h / g.items.length : g.h;
    g.items.forEach((it) => {
      it.h = Math.max(18, itemH);
      it.y = iy;
      iy += it.h;
    });
    y += g.h + 8;
  });
  let paths = "";
  paths += `<rect x="36" y="${yTop}" width="96" height="${debtH}" rx="3" fill="#5c5c5c"/>`;
  paths += `<path d="M40 ${yTop + debtH + 2} H128 Q150 ${yTop + debtH + 2} 150 ${yTop + debtH + 18} V${yTop + colH - 10} Q150 ${yTop + colH} 128 ${yTop + colH} H40 Z" fill="#1e6b56"/>`;
  paths += `<rect x="188" y="${yTop}" width="14" height="${colH}" rx="3" fill="#5c5488"/>`;
  const rDebt = ribbon(132, yTop, debtH, 188, yTop, Math.max(8, debtH * 0.4));
  const rNet = ribbon(132, yTop + debtH + 2, netH - 2, 188, yTop + Math.max(10, debtH * 0.4), colH - Math.max(10, debtH * 0.4));
  paths += `<path d="${rDebt}" fill="#6a6a6a" opacity=".85"/>`;
  paths += `<path d="${rNet}" fill="#1e6b56" opacity=".8"/>`;
  groups.forEach((g) => {
    paths += `<path d="${ribbon(202, g.y, g.h, 360, g.y, g.h)}" fill="${g.fill}"/>`;
    paths += `<rect x="360" y="${g.y}" width="10" height="${g.h}" fill="${g.color}"/>`;
    const lab = skState.mode === "hide" ? g.label : g.label + " " + wan(g.total, assets);
    paths += `<text x="248" y="${g.y + g.h / 2 + 4}" font-size="12" fill="#ddd">${esc(lab)}</text>`;
    g.items.forEach((it) => {
      paths += `<path d="${ribbon(370, it.y + 2, Math.max(10, it.h - 4), 560, it.y + 2, Math.max(10, it.h - 4))}" fill="${g.fill}"/>`;
      const ilab = skState.mode === "hide" ? it.name : it.name + "  " + wan(it.v, assets);
      paths += `<text x="572" y="${it.y + it.h / 2 + 4}" font-size="13" fill="#e8e8e8">${esc(ilab)}</text>`;
    });
  });
  const debtLab = wan(-debtAbs, assets);
  const astLab = wan(t.assets, assets);
  const svg = `<svg class="sk-canvas" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="#0c0c0e"/>
    <g font-family="-apple-system,PingFang SC,sans-serif">
      <rect x="36" y="16" rx="6" fill="#1c1c1e" width="88" height="32"/>
      <text x="48" y="28" font-size="11" fill="#9a9a9a">负债</text>
      <text x="48" y="42" font-size="12" fill="#ddd">${esc(debtLab || "—")}</text>
      <rect x="132" y="16" rx="6" fill="#1c1c1e" width="100" height="32"/>
      <text x="144" y="28" font-size="11" fill="#8b86c2">总资产</text>
      <text x="144" y="42" font-size="12" fill="#ddd">${esc(astLab || "—")}</text>
      ${paths}
    </g>
  </svg>`;
  const mode = skState.mode;
  el.innerHTML = `<div class="sk-bar">
      <h2>家庭资产组成</h2>
      <select class="sk-dd" onchange="route.member=this.value;drawSankeyFull()">
        <option value="全部" ${route.member === "全部" ? "selected" : ""}>全部</option>
        ${memberList().map((m) => `<option value="${esc(m.name)}" ${route.member === m.name ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
      </select>
      <span class="grow"></span>
      <div class="sk-modes">
        <button class="${mode === "amt" ? "on" : ""}" onclick="setSkMode('amt')">金额</button>
        <button class="${mode === "pct" ? "on" : ""}" onclick="setSkMode('pct')">比例</button>
        <button class="${mode === "hide" ? "on" : ""}" onclick="setSkMode('hide')">隐藏金额</button>
      </div>
      <button class="sk-ico" title="导出" onclick="downloadSankey()">↓</button>
      <button class="sk-ico" title="关闭" onclick="closeSankey()">×</button>
    </div>
    <div class="sk-view">${t.empty ? `<div style="padding:48px 24px;color:#888">还没有明细。记下流动资金或投资账户后，这里会展开到每一笔，并可左右拖动。</div>` : svg}</div>`;
  el.classList.add("on");
  bindSkPan(el.querySelector(".sk-view"));
}

function allInvestVirtual() {
  const t = totals();
  const hist = [];
  for (const a of S.invest) for (const h of a.hist || []) hist.push({ ...h, v: (Number(h.v) || 0) * fxRate(a.cur), inn: (Number(h.inn) || 0) * fxRate(a.cur), out: (Number(h.out) || 0) * fxRate(a.cur) });
  hist.sort((a, b) => String(a.d).localeCompare(String(b.d)));
  const merged = [];
  for (const h of hist) {
    const last = merged[merged.length - 1];
    if (last && last.d === h.d) { last.v += Number(h.v) || 0; last.inn += Number(h.inn) || 0; last.out += Number(h.out) || 0; }
    else merged.push({ d: h.d, v: Number(h.v) || 0, inn: Number(h.inn) || 0, out: Number(h.out) || 0 });
  }
  const inAmt = S.invest.reduce((n, a) => n + (a.inAmt || 0) * fxRate(a.cur), 0);
  const outAmt = S.invest.reduce((n, a) => n + (a.outAmt || 0) * fxRate(a.cur), 0);
  const virt = { amount: t.inv, inAmt, outAmt, hist: merged, expected: S.expected };
  const st = investStats(virt);
  st.amount = t.inv;
  st.pnl = t.pnl;
  return { virt, st };
}

    <b>${esc(title)}</b>
    ${hasFlow ? `<input id="inAmt" type="number" placeholder="投入（可空）" /><input id="outAmt" type="number" placeholder="转出（可空）" />` : ""}
    <input id="newAmt" type="number" value="${a.amount}" />
    <button class="ok" onclick="commitUpdate(${hasFlow})">保存记录</button>
  </div>`;
}
function commitUpdate(hasFlow) {
  const a = S.invest.find((x) => x.id === updateTarget);
  const v = Number(document.getElementById("newAmt").value);
  if (!Number.isFinite(v)) { toast("请输入金额"); return; }
  let inn = 0, out = 0;
  if (hasFlow) {
    inn = Number(document.getElementById("inAmt").value) || 0;
    out = Number(document.getElementById("outAmt").value) || 0;
    a.inAmt = (a.inAmt || 0) + inn;
    a.outAmt = (a.outAmt || 0) + out;
  }
  a.amount = v;
  a.updated = today();
  a.hist = [...(a.hist || []), { d: today(), v, inn, out }];
  addLog("invest", a);
  captureSnap();
  save(); closeMask(); toast("已记下"); render();
}
function closeMask() { const m = document.getElementById("mask"); m.className = "mask"; m.innerHTML = ""; }
function openReminder() {
  document.getElementById("mask").className = "mask on";
  document.getElementById("mask").innerHTML = `<div class="dlg">
    <b>记账提醒</b>
    <div class="k">每月几号提醒自己更新（0 为关闭）</div>
    <input id="remDay" type="number" min="0" max="28" value="${S.reminder || 0}" />
    <button class="ok" onclick="S.reminder=Math.max(0,Math.min(28,Number(document.getElementById('remDay').value)||0));save();closeMask();toast(S.reminder?'已设每月'+S.reminder+'日':'已关闭提醒');render()">保存</button>
  </div>`;
}
function openCustomRange() {
  document.getElementById("mask").className = "mask on";
  document.getElementById("mask").innerHTML = `<div class="dlg">
    <b>自定义区间</b>
    <input id="fromD" type="date" value="${route.from || ""}" />
    <input id="toD" type="date" value="${route.to || ""}" />
    <button class="ok" onclick="route.from=document.getElementById('fromD').value;route.to=document.getElementById('toD').value;route.chartRange='custom';closeMask();render()">查看</button>
  </div>`;
}
function fillExample(name) {
  route.draft = { ...(route.draft || { amount: "", bucket: "长期", cur: "CNY", expected: S.expected }), name };
  render();
  const el = document.getElementById("invName");
  if (el) el.focus();
}
function draftField(key, value) {
  route.draft = { name: "", amount: "", bucket: "长期", cur: "CNY", expected: S.expected, ...(route.draft || {}), [key]: value };
  if (key === "name" || key === "amount") {
    const btn = document.querySelector(".ok-btn");
    const d = route.draft;
    const ready = d.name.trim() && d.amount !== "" && Number.isFinite(Number(d.amount));
    if (btn) { btn.classList.toggle("ready", ready); btn.disabled = !ready; }
    return;
  }
  render();
}
function commitInvest() {
  const d = route.draft || {};
  const amount = Number(d.amount);
  if (!d.name || !Number.isFinite(amount)) return;
  const item = {
    id: uid(), name: d.name.trim(), cur: d.cur || "CNY", amount, bucket: d.bucket || "长期",
    owner: "我", inAmt: amount, outAmt: 0, updated: today(), expected: Number(d.expected) || S.expected,
    hist: [{ d: today(), v: amount, inn: amount, out: 0 }]
  };
  S.invest.push(item);
  addLog("invest", item);
  captureSnap();
  save();
  route.draft = null;
  go("invest");
}
function exportBook() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fire-simple-" + today() + ".json";
  a.click();
  toast("已导出简化版账本");
}
function importBook() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (data && (data.market || data.code || Array.isArray(data.records) || data.holdings)) {
          toast("这是完整版数据，未导入");
          return;
        }
        S = normalize(data);
        captureSnap();
        save();
        render();
        toast("已导入简化版账本");
      } catch { toast("文件无法识别"); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function themeIcon() {
  return document.documentElement.classList.contains("dark")
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5Z"/></svg>`;
}
function toggleTheme() {
  const next = !document.documentElement.classList.contains("dark");
  document.documentElement.classList.toggle("dark", next);
  localStorage.setItem("fire-simple-theme", next ? "dark" : "light");
  const btn = document.getElementById("themeBtn");
  if (btn) btn.innerHTML = themeIcon();
}

const WIN_KEY = "fire-simple-win";
const winEl = document.getElementById("win");
let winState = { x: 24, y: 24, w: 600, h: 0, fixed: false };
try {
  const saved = JSON.parse(localStorage.getItem(WIN_KEY) || "null");
  if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) winState = { ...winState, ...saved, h: 0 };
} catch {}
function pageMinW() { return PAGE_W[route.name] || 600; }
function displayW() { return Math.max(winState.w, pageMinW()); }
function saveWin() {
  try { localStorage.setItem(WIN_KEY, JSON.stringify({ x: winState.x, y: winState.y, w: winState.w, h: 0, fixed: winState.fixed })); } catch {}
}
function syncScroll() {
  const body = document.getElementById("app");
  if (!body) return;
  const need = body.scrollHeight > body.clientHeight + 2;
  body.classList.toggle("can-y", need);
  if (!need) body.scrollTop = 0;
}
function applyWin() {
  const maxW = Math.max(360, window.innerWidth - 16);
  const maxH = Math.max(320, window.innerHeight - 48);
  const width = Math.min(displayW(), maxW);
  let x = winState.x, y = winState.y;
  if (x + width > window.innerWidth) x = Math.max(0, window.innerWidth - width - 8);
  if (y > window.innerHeight - 80) y = Math.max(0, window.innerHeight - 80);
  winEl.style.transform = `translate(${x}px, ${y}px)`;
  winEl.style.width = width + "px";
  winEl.style.height = winState.h ? Math.min(winState.h, maxH) + "px" : "auto";
  winEl.classList.toggle("is-fixed", winState.fixed);
  const pin = document.getElementById("pinBtn");
  if (pin) {
    pin.classList.toggle("is-on", winState.fixed);
    pin.title = winState.fixed ? "已固定窗口（点击解锁拖动）" : "固定窗口（锁定当前位置）";
    const svg = pin.querySelector("svg");
    if (svg) svg.setAttribute("fill", winState.fixed ? "currentColor" : "none");
  }
  requestAnimationFrame(() => {
    if (!winState.h) {
      const h = winEl.getBoundingClientRect().height;
      if (h > maxH + 1) winEl.style.height = maxH + "px";
    }
    syncScroll();
  });
}
function togglePin() { winState.fixed = !winState.fixed; saveWin(); applyWin(); }

let drag = null;
document.getElementById("winBar").addEventListener("pointerdown", (e) => {
  if (winState.fixed) return;
  if (e.target.closest("button")) return;
  e.preventDefault();
  drag = { kind: "move", x: e.clientX, y: e.clientY, bx: winState.x, by: winState.y };
  winEl.setPointerCapture(e.pointerId);
});
winEl.querySelectorAll(".handle").forEach((h) => {
  h.addEventListener("pointerdown", (e) => {
    if (winState.fixed) return;
    e.preventDefault();
    e.stopPropagation();
    const r = winEl.getBoundingClientRect();
    drag = { kind: "resize", dir: h.dataset.dir, x: e.clientX, y: e.clientY, bx: winState.x, by: winState.y, bw: r.width, bh: r.height };
    winEl.setPointerCapture(e.pointerId);
  });
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (drag.kind === "move") {
    winState.x = Math.max(0, drag.bx + dx);
    winState.y = Math.max(0, drag.by + dy);
  } else {
    const minW = 360;
    const minH = 320;
    let { bx, by, bw, bh, dir } = drag;
    if (dir.includes("e")) winState.w = Math.max(minW, bw + dx);
    if (dir.includes("s")) winState.h = Math.max(minH, bh + dy);
    if (dir.includes("w")) {
      const w = Math.max(minW, bw - dx);
      winState.x = bx + (bw - w);
      winState.w = w;
    }
    if (dir.includes("n")) {
      const h = Math.max(minH, bh - dy);
      winState.y = Math.max(0, by + (bh - h));
      winState.h = h;
    }
  }
  applyWin();
});
window.addEventListener("pointerup", () => { if (!drag) return; drag = null; saveWin(); });
window.addEventListener("resize", applyWin);

function setFoot(html) {
  const f = document.getElementById("foot");
  const body = document.getElementById("app");
  if (!f) return;
  f.innerHTML = html || "";
  f.classList.toggle("on", Boolean(html));
  if (body) body.classList.toggle("has-dock", Boolean(html));
}
function cycleInvFilter() {
  const opts = ["全部资产", "活钱", "稳健", "长期"];
  const i = opts.indexOf(route.invFilter || "全部资产");
  route.invFilter = opts[(i + 1) % opts.length];
  render({ resize: false });
}
function cycleComposeRange() {
  const opts = ["all", "ytd", "1y"];
  const i = opts.indexOf(route.chartRange || "all");
  route.chartRange = opts[(i + 1) % opts.length];
  render({ resize: false });
}
function render(opts) {
  opts = opts || {};
  const map = {
    home, weather: weatherPage, cashflow: cashflowPage, family, calendar: calendarPage, manage: managePage,
    update: updateFamily, addItem: addItemPage, editItem: editItemPage, help: helpPage,
    invest: investHome, addInvest: addInvestPage, summary, account, settings: settingsPage
  };
  try {
    document.getElementById("app").innerHTML = (map[route.name] || home)();
  } catch (err) {
    console.error(err);
    toast("页面出错，已回到总览");
    route.name = "home";
    document.getElementById("app").innerHTML = home();
  }
  const body = document.getElementById("app");
  if (body && opts.keepScroll !== true) body.scrollTop = 0;
  if (route.name === "family") {
    setFoot(`<button class="cta" type="button" onclick="go('update',{cat:'cash'})">更新资产</button>`);
  } else if (route.name === "account" && route.account) {
    setFoot(`<button class="cta" type="button" onclick="openUpdate('${route.account}')">更新收益</button>`);
  } else if (route.name === "update") {
    const idx = CATS.findIndex((c) => c.id === route.cat);
    const next = idx >= 0 && idx < CATS.length - 1 ? `go('update',{cat:'${CATS[idx + 1].id}'})` : "finishUpdate()";
    setFoot(`<button class="fab" type="button" onclick="${next}">→</button>`);
  } else {
    setFoot("");
  }
  if (opts.resize !== false) applyWin();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSankey(); });

if (localStorage.getItem("fire-simple-theme") === "dark") document.documentElement.classList.add("dark");
document.getElementById("themeBtn").innerHTML = themeIcon();
applyWin();
render();
hydrate();
</script>
</body>
</html>
