<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Fire 简化版</title>
  <style>
    :root {
      --ink: #262626;
      --muted: #8c8c8c;
      --faint: #bfbfbf;
      --bg: #ffffff;
      --page: #f5f5f5;
      --gray: #fafafa;
      --line: #f0f0f0;
      --card: #ffffff;
      --chip: #f3f3f3;
      --input: #f6f6f6;
      --sheet: #ffffff;
      --ghost-bd: #dddddd;
      --seg: #f3f5f7;
      --dash: #d8d8d8;
      --toggle: #e6e6e6;
      --knob: #ffffff;
      --ok-off: #d7eefc;
      --ok-off-t: #9ec9e6;
      --add-head: #eaf3f8;
      --ex-t: #c8c8c8;
      --lab: #888888;
      --red: #e55f5c;
      --green: #2eb789;
      --blue: #22a3ff;
      --lav: #edebf6;
      --lav-2: #f5f4f9;
      --bar: #a4a2d4;
      --tab: #a4a2d4;
      --invest: #def1ff;
      --cash: #f9ece6;
      --cash-t: #ab5c35;
      --chip-p: #e5e5f1;
      --chip-t: #deecec;
      --chip-y: #f3ead6;
      --s-green: #c8e9de;
      --s-purple: #d5d4e4;
      --weather: #f2faeb;
      --in: #e9ecfd;
      --out: #fdeee7;
      --chart-p: #7a5ea7;
      --body-bg: #ececec;
      --win-shadow: 0 12px 40px rgba(0,0,0,.12);
      --mask: rgba(0,0,0,.45);
      --w: 600px;
    }
    html.dark {
      --ink: #eef1f6;
      --muted: #99a3b2;
      --faint: #677183;
      --bg: #151b26;
      --page: #0f141e;
      --gray: #1c222d;
      --line: #252c3a;
      --card: #1c222d;
      --chip: #252c3a;
      --input: #1a2230;
      --sheet: #1c222d;
      --ghost-bd: #323a4b;
      --seg: #252c3a;
      --dash: #3a4354;
      --toggle: #323a4b;
      --knob: #eef1f6;
      --ok-off: #1a3348;
      --ok-off-t: #5a7a90;
      --add-head: #1a2833;
      --ex-t: #5a6472;
      --lab: #8b95a6;
      --lav: #2a2740;
      --lav-2: #242236;
      --invest: #1a3348;
      --cash: #3a2c26;
      --cash-t: #e0a07a;
      --chip-p: #2c2a40;
      --chip-t: #243834;
      --chip-y: #3a3424;
      --s-green: #1e3d34;
      --s-purple: #2f2d48;
      --weather: #243028;
      --in: #252a40;
      --out: #3a2a24;
      --body-bg: #0a0e19;
      --win-shadow: 0 16px 48px rgba(0,0,0,.45);
      --mask: rgba(0,0,0,.62);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100dvh; background: var(--body-bg); overflow: hidden; }
    body {
      color: var(--ink);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", "Helvetica Neue", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    input, select, textarea { background: var(--input); border: 0; }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    .win {
      position: fixed; left: 0; top: 0; z-index: 20;
      width: var(--w); height: auto; max-height: calc(100dvh - 48px);
      display: flex; flex-direction: column;
      background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--win-shadow); overflow: hidden;
    }
    .win.is-fixed { box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    html.dark .win.is-fixed { box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .win-bar {
      flex: none; height: 42px; display: flex; align-items: center; gap: 10px;
      padding: 0 12px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none;
      background: var(--bg); color: var(--ink);
    }
    .win.is-fixed .win-bar { cursor: default; }
    .win-bar:active { cursor: grabbing; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; }
    .win-title { flex: 1; font-size: 13px; font-weight: 650; color: var(--muted); }
    .win-bar button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
    .win-bar button:hover { background: var(--gray); }
    .win-bar button.is-on { color: var(--ink); }
    .win-body {
      flex: 1; min-height: 0; overflow: hidden; background: var(--bg);
      scrollbar-width: thin; scrollbar-color: var(--dash) var(--bg);
    }
    .win-body.can-y { overflow-y: auto; }
    .win-body::-webkit-scrollbar { width: 8px; height: 0; }
    .win-body::-webkit-scrollbar-track { background: var(--bg); }
    .win-body::-webkit-scrollbar-thumb { background: var(--dash); border-radius: 8px; }
    .scroll-x { overflow-x: auto; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { height: 0; }
    .handle { position: absolute; width: 14px; height: 14px; z-index: 5; }
    .handle.nw { left: 0; top: 0; cursor: nwse-resize; }
    .handle.ne { right: 0; top: 0; cursor: nesw-resize; }
    .handle.sw { left: 0; bottom: 0; cursor: nesw-resize; }
    .handle.se { right: 0; bottom: 0; cursor: nwse-resize; }
    .win.is-fixed .handle { display: none; }
    .screen { display: none; padding-bottom: 20px; background: var(--bg); width: 100%; max-width: 100%; overflow: hidden; position: relative; }
    .screen.on { display: block; }
    .screen.gray { background: var(--page); }
    .head { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 8px 12px 4px 8px; position: relative; }
    .head h1 { margin: 0; flex: 1; min-width: 0; font-size: 22px; font-weight: 750; line-height: 1.25; }
    .head .right { display: flex; align-items: center; gap: 12px; margin-left: auto; flex: none; }
    .theme-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
    .theme-btn:hover { background: var(--gray); }
    .add-head { background: var(--add-head); padding: 12px 16px 18px; }
    .add-head h1 { margin: 12px 0 14px; color: var(--ink); }
    .ex { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .ex-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ex-chip { background: var(--card); border-radius: 12px; padding: 10px 14px; color: var(--ex-t); font-size: 13px; text-align: left; border: 1px solid var(--line); }
    .ex-chip small { display: block; margin-top: 2px; font-size: 11px; }
    .add-body { background: var(--bg); border-radius: 20px 20px 0 0; margin-top: -8px; padding: 20px 16px 16px; }
    .field { margin-bottom: 22px; }
    .field label { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--ink); }
    .field input, .field select {
      width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--input);
      padding: 0 16px; outline: none; font-size: 16px; color: var(--ink);
    }
    .types { display: flex; gap: 10px; }
    .types button {
      flex: 1; height: 40px; border: 1px solid var(--ghost-bd); border-radius: 20px;
      background: var(--card); color: var(--ink);
    }
    .types button.on { border-color: var(--ink); font-weight: 650; }
    .more { color: var(--ink); font-size: 14px; font-weight: 650; padding: 8px 0 16px; }
    .ok-btn { width: 100%; height: 48px; border-radius: 24px; background: var(--ok-off); color: var(--ok-off-t); font-size: 16px; font-weight: 650; }
    .ok-btn.ready { background: var(--blue); color: #fff; }
    .bar {
      height: 44px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; font-size: 14px; font-weight: 600; color: var(--ink); position: relative;
    }
    .bar .mid { position: absolute; left: 50%; transform: translateX(-50%); }
    .bar .right { display: flex; align-items: center; gap: 14px; color: var(--ink); font-weight: 400; }
    .back { width: 32px; height: 32px; display: grid; place-items: center; font-size: 22px; line-height: 1; color: var(--ink); }
    .pad { padding: 0 16px; }
    h1 { margin: 4px 16px 16px; font-size: 26px; font-weight: 750; letter-spacing: .02em; color: var(--ink); }
    .eye { opacity: .55; font-size: 18px; }
    .card { border-radius: 18px; background: var(--card); color: var(--ink); }
    .lav { background: var(--lav-2); }
    .lav-deep { background: var(--lav); }
    .inv-home { background: var(--card); box-shadow: 0 1px 0 var(--line); }
    .shadow { box-shadow: 0 1px 0 rgba(0,0,0,.02); }
    .red { color: var(--red); } .green { color: var(--green); }
    .muted { color: var(--muted); } .faint { color: var(--faint); }
    .cta {
      display: block; margin: 20px 16px 4px; width: auto; height: 48px; border-radius: 24px;
      background: var(--blue); color: #fff; font-size: 16px; font-weight: 650;
    }
    .fab {
      display: grid; place-items: center; margin: 20px auto 8px;
      width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 26px; box-shadow: 0 8px 20px rgba(34,163,255,.35);
    }
    .row-card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; color: var(--ink); }
    .split { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .k { font-size: 12px; color: var(--muted); }
    .n { font-size: 28px; font-weight: 750; letter-spacing: -.03em; color: var(--ink); }
    .n small { font-size: 14px; font-weight: 500; margin-left: 2px; }
    .pills { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; flex-wrap: nowrap; }
    .pill { height: 32px; padding: 0 16px; border-radius: 16px; background: var(--chip); color: var(--muted); font-size: 14px; }
    .pill.on { background: var(--tab); color: #fff; }
    .manage { margin-left: auto; flex: none; color: var(--muted); font-size: 14px; padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; }
    .cats { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 16px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat { flex: none; width: 132px; min-height: 72px; padding: 12px; border-radius: 14px; background: var(--chip); text-align: center; color: var(--ink); }
    .cat b { display: block; font-size: 14px; font-weight: 650; }
    .cat span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .cat.on-cash { background: var(--cash); color: var(--cash-t); }
    .cat.on-cash span { color: var(--cash-t); }
    .cat.on-inv { background: var(--lav); color: #8b86c8; }
    html.dark .cat.on-inv { color: #b7b3e0; }
    .cat.on-debt { background: var(--chip); }
    .hint { margin: 0 16px 12px; padding: 12px 14px; border-radius: 12px; background: var(--cash); color: var(--cash-t); font-size: 14px; display: flex; justify-content: space-between; }
    .me { margin: 0 16px; color: #6b67a8; font-weight: 750; font-size: 16px; }
    html.dark .me { color: #b7b3e0; }
    .acct { display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 14px; padding: 16px; margin: 8px 16px; color: var(--ink); }
    .acct b { font-weight: 500; }
    .acct .amt { text-align: right; white-space: nowrap; }
    .acct small { display: block; margin-top: 4px; color: var(--faint); font-size: 12px; }
    .add-dash { margin: 18px 16px; padding: 16px; border: 1px dashed var(--dash); border-radius: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; background: transparent; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
    .mini { background: var(--card); border-radius: 18px; padding: 16px; min-height: 168px; box-shadow: 0 0 0 1px var(--line); color: var(--ink); }
    .weather { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--weather); color: var(--ink); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    .toggle { width: 42px; height: 24px; border-radius: 12px; background: var(--toggle); position: relative; display: inline-block; vertical-align: middle; }
    .toggle i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px #0002; }
    .toggle.on { background: var(--bar); } .toggle.on i { left: 20px; }
    .inner { background: var(--card); border-radius: 14px; padding: 14px; margin-top: 12px; color: var(--ink); }
    .bars { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: 86px; gap: 6px; margin-top: 8px; }
    .bars span { display: block; height: 2px; background: var(--line); border-radius: 2px; }
    .bars span.up { background: var(--bar); }
    .bars + .labs { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--lab); text-align: center; margin-top: 6px; }
    .bars + .labs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sankey { width: 100%; max-width: 520px; height: 200px; margin: 4px auto 8px; overflow: hidden; }
    .sankey svg { width: 100%; height: 200px; display: block; }
    .comp { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; }
    .comp > div { min-width: 0; background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); color: var(--ink); }
    .money4 { display: flex; gap: 8px; }
    .money4 > div { flex: 1; text-align: center; min-width: 0; }
    .tl { padding: 4px 0 8px 8px; border-left: 2px solid var(--line); margin-left: 8px; }
    .tl h4 { margin: 0 0 8px -15px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .tl h4::before { content: ""; display: inline-block; width: 8px; height: 8px; border: 2px solid var(--dash); border-radius: 50%; background: var(--card); margin-right: 8px; }
    .inv { background: var(--invest); border-radius: 18px; padding: 18px 16px 16px; margin: 0 16px 18px; color: var(--ink); }
    .asset { background: var(--gray); border-radius: 16px; padding: 16px; margin: 0 16px 12px; color: var(--ink); }
    .ghost-btn { height: 32px; padding: 0 12px; border: 1px solid var(--ghost-bd); border-radius: 16px; font-size: 13px; background: var(--card); color: var(--ink); white-space: nowrap; }
    .seg { display: flex; background: var(--seg); border-radius: 20px; padding: 3px; margin: 12px 0; }
    .seg button { flex: 1; height: 32px; border-radius: 16px; color: var(--muted); }
    .seg button.on { background: var(--card); color: var(--ink); font-weight: 650; }
    .ranges { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; }
    .ranges button { height: 32px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; }
    .ranges button:last-child { border: 0; }
    .ranges button.on { color: var(--blue); }
    .chart { height: 180px; width: 100%; min-width: 0; display: block; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--ink); }
    .table th { color: var(--muted); font-weight: 400; text-align: left; padding: 6px 8px 6px 0; white-space: nowrap; }
    .table td { padding: 10px 8px 10px 0; white-space: nowrap; }
    .table td:nth-child(2), .table td:nth-child(3) { text-align: right; }
    .flow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; justify-items: center; }
    .flow .box { width: 100%; background: var(--gray); border-radius: 12px; padding: 12px 8px; text-align: center; color: var(--ink); }
    .flow .wide { grid-column: 1 / -1; width: 58%; }
    .mask { position: fixed; inset: 0; background: var(--mask); z-index: 30; display: none; }
    .mask.on { display: block; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); color: var(--ink); border-radius: 16px 16px 0 0; padding: 18px 16px 28px; }
    .sheet .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .sheet .pair button { height: 140px; border-radius: 16px; padding: 18px; text-align: center; color: var(--ink); }
    .dlg { position: absolute; left: 24px; right: 24px; top: 24%; background: var(--sheet); color: var(--ink); border-radius: 16px; padding: 20px 16px 16px; }
    .dlg input, .dlg select { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; outline: none; margin: 10px 0 14px; background: var(--input); color: var(--ink); }
    .dlg .ok { width: 100%; height: 40px; border-radius: 10px; background: var(--blue); color: #fff; }
    .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 12px; opacity: 0; transition: .2s; z-index: 50; pointer-events: none; }
    html.dark .toast { background: #eef1f6; color: #151b26; }
    .toast.on { opacity: 1; }
    .help p { color: var(--muted); line-height: 1.75; margin: 0 0 12px; }
    .danger { color: var(--red); }
    .w-card { background: var(--card); border-radius: 16px; padding: 16px; margin: 12px 16px; color: var(--ink); }
    .menu {
      position: absolute; right: 12px; top: 40px; min-width: 168px; background: var(--sheet);
      border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 8; box-shadow: var(--win-shadow);
    }
    .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; color: var(--ink); }
    .menu button:hover { background: var(--gray); }
    .metric { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
    .nowrap { white-space: nowrap; }
    .cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cf-box { background: var(--gray); border-radius: 14px; padding: 14px; }
    .ratio-bar { height: 8px; background: var(--bar); border-radius: 4px; margin: 14px 0 12px; overflow: hidden; display: flex; }
    .ratio-bar i { display: block; height: 100%; }
  </style>
</head>
<body>
<div class="win" id="win">
  <div class="win-bar" id="winBar" title="按住拖动窗口">
    <span class="dots" aria-hidden="true"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
    <span class="win-title">Fire 简化版</span>
    <button type="button" id="pinBtn" title="固定窗口" aria-label="固定窗口" onclick="togglePin()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v5l3 3v2H7v-2l3-3V4"/><path d="M9 4h6"/><path d="M12 14v6"/></svg>
    </button>
    <button type="button" id="themeBtn" title="浅色 / 深色" aria-label="浅色深色切换" onclick="toggleTheme()"></button>
  </div>
  <div class="win-body" id="app"></div>
  <i class="handle nw" data-dir="nw"></i>
  <i class="handle ne" data-dir="ne"></i>
  <i class="handle sw" data-dir="sw"></i>
  <i class="handle se" data-dir="se"></i>
</div>
<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>
<script>
const KEY = "fire-simple-book-v3";
const KEY_OLD = "fire-simple-book-v2";
const PAGE_W = {
  home: 600, weather: 640, cashflow: 680, family: 740, calendar: 720, manage: 740,
  update: 740, addItem: 600, editItem: 640, help: 640, invest: 740, addInvest: 600,
  summary: 840, account: 840, settings: 640
};
const EMPTY = {
  hide: false, excludeFixed: false, displayCur: "CNY",
  fx: { CNY: 1, HKD: 0.92, USD: 7.18 },
  reminder: 0, expected: 8,
  cash: [], fixed: [], receivable: [], debt: [], invest: [],
  cashflow: { stable: 0, flex: 0, income: 0 },
  snaps: [], logs: []
};
const CATS = [
  { id: "cash", label: "流动资金", hint: "随时可取用的现金、活期、余额宝等" },
  { id: "fixed", label: "固定资产", hint: "房产、车辆等变现较慢的资产" },
  { id: "invest", label: "投资理财", hint: "股票、基金、理财账户的当前市值" },
  { id: "receivable", label: "应收款", hint: "别人欠你、押金、待退款" },
  { id: "debt", label: "负债", hint: "房贷、信用卡、花呗等需要偿还的钱" }
];
const EXAMPLES = {
  cash: ["支付宝微信", "银行卡", "现金", "汇丰(港币)"],
  fixed: ["房产", "车辆", "其他"],
  receivable: ["他人借款", "押金", "待退款"],
  debt: ["房贷", "信用卡", "花呗", "借呗"],
  invest: ["长钱账户", "余额宝", "固收+组合", "雪球组合", "招商银行理财", "券商账户", "海外资产"]
};
const CURS = [
  { code: "CNY", name: "人民币", unit: "元" },
  { code: "HKD", name: "港元", unit: "港元" },
  { code: "USD", name: "美元", unit: "美元" }

function yearMwr(hist, year) {

  const before = (hist || []).filter((h) => String(h.d).slice(0, 4) < String(year)).sort((a, b) => String(a.d).localeCompare(String(b.d)));
  if (!pts.length) return null;

  const out = pts.reduce((n, h) => n + (Number(h.out) || 0), 0);

function groupedLogs() {
  const rows = route.showAll ? S.logs : S.logs.slice(0, 8);
  const map = [];
  for (const it of rows) {
    const at = String(it.at).slice(0, 10);
    const last = map[map.length - 1];
    if (last && last.at === at) last.items.push(it);
    else map.push({ at, items: [it] });
  }
  return map;
}
function ribbon(x0, y0, h0, x1, y1, h1) {
  const m = (x0 + x1) / 2;
  return `M${x0},${y0} C${m},${y0} ${m},${y1} ${x1},${y1} L${x1},${y1 + h1} C${m},${y1 + h1} ${m},${y0 + h0} ${x0},${y0 + h0} Z`;
}
function sankeySvg(t) {
  const debtN = S.debt.length;
  const assets = Math.max(t.assets, 1);
  let cashR = t.empty ? 0.2 : Math.max(0.08, t.cash / assets);
  let invR = t.empty ? 0.8 : Math.max(0.08, t.inv / assets);
  const tot = cashR + invR;
  cashR /= tot; invR /= tot;
  const H = 120;
  const ch = Math.max(18, H * cashR);
  const ih = H - ch;
  return `<svg viewBox="0 0 520 200" preserveAspectRatio="xMidYMid meet">
    <text x="8" y="22" font-size="12" fill="var(--muted)">${debtN}项负债</text>
    <rect x="8" y="28" width="86" height="7" rx="2" fill="var(--dash)"/>
    <path d="M16 48 H100 Q122 48 122 66 V154 Q122 172 100 172 H16 Z" fill="var(--s-green)"/>
    <rect x="10" y="48" width="6" height="124" rx="2" fill="#3cbf8a"/>
    <text x="28" y="116" font-size="13" fill="var(--ink)">净资产</text>
    <text x="150" y="38" font-size="12" fill="#8a86c2">负债 总资产</text>
    <rect x="198" y="46" width="10" height="124" rx="2" fill="var(--bar)"/>
    <path d="${ribbon(208, 50, ch, 348, 50, Math.max(16, ch - 8))}" fill="var(--cash)"/>
    <path d="${ribbon(208, 50 + ch, ih, 348, 58 + ch, ih)}" fill="var(--s-purple)"/>
    <rect x="346" y="50" width="6" height="${Math.max(16, ch - 8)}" fill="#c47a52"/>
    <text x="360" y="${50 + Math.max(16, ch - 8) / 2 + 4}" font-size="12" fill="var(--cash-t)">流动资金</text>
    <text x="360" y="${58 + ch + ih / 2 + 4}" font-size="13" fill="#8a86c2">投资理财</text>
  </svg>`;
}

function removeItem(cat, id) {
  if (!confirm("删除这条记录？")) return;
  if (cat === "invest") S.invest = S.invest.filter((x) => x.id !== id);
  else S[cat] = (S[cat] || []).filter((x) => x.id !== id);
  S.logs = S.logs.filter((x) => !(x.cat === cat && x.id === id));
  captureSnap();
  save();
  toast("已删除");

  st.pnl = t.pnl;

function chartBlock(hist, expected) {
  const kind = route.chartKind || "mwr";

  const list = filterHist(hist, range);
  const series = chartSeries(list, kind);
  const path = poly(series, 20, 350, 18, 150);
  const first = list[0] ? pretty(list[0].d) : "";
  const last = list.length ? pretty(list[list.length - 1].d) : "";
  const yMax = series.length ? Math.max(...series, 0) : 0;
  const yMin = series.length ? Math.min(...series, 0) : 0;
  return `<div class="seg">
      <button class="${kind === "mwr" ? "on" : ""}" onclick="route.chartKind='mwr';render()">收益率曲线</button>
      <button class="${kind === "pnl" ? "on" : ""}" onclick="route.chartKind='pnl';render()">累计收益曲线</button>
    </div>
    <div class="k" style="text-align:center">━ 资金加权收益率　… 预期收益率 ${expected ? expected + "%" : ""}</div>
    <div class="scroll-x">
      <svg class="chart" viewBox="0 0 360 170" preserveAspectRatio="xMidYMid meet">
        <line x1="8" x2="352" y1="30" stroke="var(--line)" /><line x1="8" x2="352" y1="70" stroke="var(--line)" />
        <line x1="8" x2="352" y1="110" stroke="var(--line)" /><line x1="8" x2="352" y1="150" stroke="var(--line)" />
        ${path ? `<path d="${path}" fill="none" stroke="#22a3ff" stroke-width="2.2" />` : `<text x="120" y="90" font-size="12" fill="var(--faint)">记账后这里会出现曲线</text>`}
        <text x="20" y="168" font-size="11" fill="var(--faint)">${first}</text>
        <text x="268" y="168" font-size="11" fill="var(--faint)">${last}</text>
        <text x="8" y="16" font-size="10" fill="var(--faint)">${kind === "pnl" ? yMax.toFixed(0) : yMax.toFixed(1) + "%"}</text>

      <button class="${range === "ytd" ? "on" : ""}" onclick="route.chartRange='ytd';render()">今年</button>

    </div></div>`;
}
function yearTable(hist, fallback) {
  const years = [...new Set((hist || []).map((h) => String(h.d).slice(0, 4)))].sort().reverse();
  const st = fallback;
  return `<div class="card" style="margin:12px 16px;padding:16px;border-radius:18px">

function allInvestVirtual() {
  const t = totals();
  const hist = [];
  for (const a of S.invest) for (const h of a.hist || []) hist.push({ ...h, v: (Number(h.v) || 0) * fxRate(a.cur), inn: (Number(h.inn) || 0) * fxRate(a.cur), out: (Number(h.out) || 0) * fxRate(a.cur) });
  hist.sort((a, b) => String(a.d).localeCompare(String(b.d)));
  const merged = [];
  for (const h of hist) {
    const last = merged[merged.length - 1];
    if (last && last.d === h.d) { last.v += Number(h.v) || 0; last.inn += Number(h.inn) || 0; last.out += Number(h.out) || 0; }
    else merged.push({ d: h.d, v: Number(h.v) || 0, inn: Number(h.inn) || 0, out: Number(h.out) || 0 });
  }
  const inAmt = S.invest.reduce((n, a) => n + (a.inAmt || 0) * fxRate(a.cur), 0);
  const outAmt = S.invest.reduce((n, a) => n + (a.outAmt || 0) * fxRate(a.cur), 0);
  const virt = { amount: t.inv, inAmt, outAmt, hist: merged, expected: S.expected };
  const st = investStats(virt);
  st.amount = t.inv;
  st.pnl = t.pnl;
  return { virt, st };
}
function summary() {
  const t = totals();

      <div class="ratio-bar">${parts.map(([k, v]) => `<i style="width:${t.inv ? v / t.inv * 100 : 0}%;background:${k === "活钱" ? "#d07a8a" : k === "稳健" ? "#5aa7b8" : "var(--bar)"}"></i>`).join("")}</div>
      ${parts.map(([k, v]) => `<div class="split" style="margin-top:8px"><span>● ${k} ${t.inv ? (v / t.inv * 100).toFixed(1) : "0.0"}%</span><span>¥ ${num(v)}</span></div>`).join("")}
      ${S.invest.map((a) => {
        const p = t.inv ? cny(a) / t.inv * 100 : 0;
        return `<div class="split faint" style="margin-top:8px;padding-left:16px"><span>${esc(a.name)} ${p.toFixed(1)}%</span><span>${money(a.amount, a.cur)}</span></div>`;

function recordFlow(hasFlow) {
  const a = S.invest.find((x) => x.id === updateTarget);
  closeMask();
  const title = hasFlow ? "记录投入/转出后的资产" : "更新 " + a.name + " 金额";
  document.getElementById("mask").className = "mask on";
  document.getElementById("mask").innerHTML = `<div class="dlg">
    <b>${esc(title)}</b>
    ${hasFlow ? `<input id="inAmt" type="number" placeholder="投入（可空）" /><input id="outAmt" type="number" placeholder="转出（可空）" />` : ""}
    <input id="newAmt" type="number" value="${a.amount}" />
    <button class="ok" onclick="commitUpdate(${hasFlow})">保存记录</button>
  </div>`;
}
function commitUpdate(hasFlow) {
  const a = S.invest.find((x) => x.id === updateTarget);
  const v = Number(document.getElementById("newAmt").value);
  if (!Number.isFinite(v)) { toast("请输入金额"); return; }
  let inn = 0, out = 0;
  if (hasFlow) {
    inn = Number(document.getElementById("inAmt").value) || 0;
    out = Number(document.getElementById("outAmt").value) || 0;
    a.inAmt = (a.inAmt || 0) + inn;
    a.outAmt = (a.outAmt || 0) + out;
  }
  a.amount = v;
  a.updated = today();
  a.hist = [...(a.hist || []), { d: today(), v, inn, out }];
  addLog("invest", a);
  captureSnap();
  save(); closeMask(); toast("已记下"); render();
}
function closeMask() { const m = document.getElementById("mask"); m.className = "mask"; m.innerHTML = ""; }

function draftField(key, value) {
  route.draft = { name: "", amount: "", bucket: "长期", cur: "CNY", expected: S.expected, ...(route.draft || {}), [key]: value };
  if (key === "name" || key === "amount") {
    const btn = document.querySelector(".ok-btn");
    const d = route.draft;
    const ready = d.name.trim() && d.amount !== "" && Number.isFinite(Number(d.amount));
    if (btn) { btn.classList.toggle("ready", ready); btn.disabled = !ready; }
    return;

function commitInvest() {
  const d = route.draft || {};
  const amount = Number(d.amount);
  if (!d.name || !Number.isFinite(amount)) return;
  const item = {
    id: uid(), name: d.name.trim(), cur: d.cur || "CNY", amount, bucket: d.bucket || "长期",
    owner: "我", inAmt: amount, outAmt: 0, updated: today(), expected: Number(d.expected) || S.expected,
    hist: [{ d: today(), v: amount, inn: amount, out: 0 }]
  };
  S.invest.push(item);
  addLog("invest", item);
  captureSnap();
  save();
  route.draft = null;
  go("invest");
}
function exportBook() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fire-simple-" + today() + ".json";
  a.click();
  toast("已导出简化版账本");
}
function importBook() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (data && (data.market || data.code || Array.isArray(data.records) || data.holdings)) {
          toast("这是完整版数据，未导入");
          return;
        }
        S = normalize(data);
        captureSnap();
        save();
        render();
        toast("已导入简化版账本");
      } catch { toast("文件无法识别"); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

const WIN_KEY = "fire-simple-win";
const winEl = document.getElementById("win");
let winState = { x: 24, y: 24, w: 600, h: 0, fixed: false };
try {
  const saved = JSON.parse(localStorage.getItem(WIN_KEY) || "null");
  if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) winState = { ...winState, ...saved, h: 0 };
} catch {}
function pageMinW() { return PAGE_W[route.name] || 600; }
function displayW() { return Math.max(winState.w, pageMinW()); }
function saveWin() {
  try { localStorage.setItem(WIN_KEY, JSON.stringify({ x: winState.x, y: winState.y, w: winState.w, h: 0, fixed: winState.fixed })); } catch {}
}
function syncScroll() {
  const body = document.getElementById("app");
  if (!body) return;
  const need = body.scrollHeight > body.clientHeight + 2;
  body.classList.toggle("can-y", need);
  if (!need) body.scrollTop = 0;

function applyWin() {
  const maxW = Math.max(360, window.innerWidth - 16);
  const maxH = Math.max(320, window.innerHeight - 48);
  const width = Math.min(displayW(), maxW);
  let x = winState.x, y = winState.y;
  if (x + width > window.innerWidth) x = Math.max(0, window.innerWidth - width - 8);
  if (y > window.innerHeight - 80) y = Math.max(0, window.innerHeight - 80);
  winEl.style.transform = `translate(${x}px, ${y}px)`;
  winEl.style.width = width + "px";
  winEl.style.height = winState.h ? Math.min(winState.h, maxH) + "px" : "auto";
  winEl.classList.toggle("is-fixed", winState.fixed);
  const pin = document.getElementById("pinBtn");
  if (pin) {
    pin.classList.toggle("is-on", winState.fixed);
    pin.title = winState.fixed ? "已固定窗口（点击解锁拖动）" : "固定窗口（锁定当前位置）";
    const svg = pin.querySelector("svg");
    if (svg) svg.setAttribute("fill", winState.fixed ? "currentColor" : "none");
  }
  requestAnimationFrame(() => {
    if (!winState.h) {
      const h = winEl.getBoundingClientRect().height;
      if (h > maxH + 1) winEl.style.height = maxH + "px";
    }
    syncScroll();
  });
}
function togglePin() { winState.fixed = !winState.fixed; saveWin(); applyWin(); }

let drag = null;
document.getElementById("winBar").addEventListener("pointerdown", (e) => {
  if (winState.fixed) return;
  if (e.target.closest("button")) return;
  e.preventDefault();
  drag = { kind: "move", x: e.clientX, y: e.clientY, bx: winState.x, by: winState.y };
  winEl.setPointerCapture(e.pointerId);
});
winEl.querySelectorAll(".handle").forEach((h) => {
  h.addEventListener("pointerdown", (e) => {
    if (winState.fixed) return;
    e.preventDefault();
    e.stopPropagation();
    const r = winEl.getBoundingClientRect();
    drag = { kind: "resize", dir: h.dataset.dir, x: e.clientX, y: e.clientY, bx: winState.x, by: winState.y, bw: r.width, bh: r.height };
    winEl.setPointerCapture(e.pointerId);
  });
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (drag.kind === "move") {
    winState.x = Math.max(0, drag.bx + dx);
    winState.y = Math.max(0, drag.by + dy);
  } else {
    const minW = 360;
    const minH = 320;
    let { bx, by, bw, bh, dir } = drag;
    if (dir.includes("e")) winState.w = Math.max(minW, bw + dx);
    if (dir.includes("s")) winState.h = Math.max(minH, bh + dy);
    if (dir.includes("w")) {
      const w = Math.max(minW, bw - dx);
      winState.x = bx + (bw - w);
      winState.w = w;
    }
    if (dir.includes("n")) {
      const h = Math.max(minH, bh - dy);
      winState.y = Math.max(0, by + (bh - h));
      winState.h = h;
    }
  }
  applyWin();
});
window.addEventListener("pointerup", () => { if (!drag) return; drag = null; saveWin(); });
window.addEventListener("resize", applyWin);

function render() {
  const map = {
    home, weather: weatherPage, cashflow: cashflowPage, family, calendar: calendarPage, manage: managePage,
    update: updateFamily, addItem: addItemPage, editItem: editItemPage, help: helpPage,
    invest: investHome, addInvest: addInvestPage, summary, account, settings: settingsPage
  };
  document.getElementById("app").innerHTML = (map[route.name] || home)();
  const body = document.getElementById("app");
  if (body) body.scrollTop = 0;
  applyWin();
}

if (localStorage.getItem("fire-simple-theme") === "dark") document.documentElement.classList.add("dark");
document.getElementById("themeBtn").innerHTML = themeIcon();
applyWin();
render();
hydrate();
</script>
